  <script id="fam-academy-fam-bridge" nonce="__FAM_CSP_NONCE__">
    window.FAM_ACADEMY_BOOTSTRAP = __FAM_ACADEMY_BOOTSTRAP__;
    try {
      const savedTheme = localStorage.getItem('fam.academy.theme');
      const uiTheme = localStorage.getItem('fam.ui.theme');
      const resolvedTheme = (savedTheme === 'light' || savedTheme === 'dark') ? savedTheme : (uiTheme === 'light' ? 'light' : uiTheme === 'original' ? 'dark' : null);
      if (resolvedTheme) document.documentElement.dataset.theme = resolvedTheme;
    } catch (_) {}
    (() => {
      'use strict';
      const boot = window.FAM_ACADEMY_BOOTSTRAP || {};
      const csrf = boot.csrf || '';
      const stored = boot.progress || {};
      function readProgress() {
        if (Array.isArray(stored.completed)) return stored;
        for (const key of ['fam4.learn.v1', 'fam3.progress.v1']) {
          if (typeof stored[key] !== 'string') continue;
          try {
            const parsed = JSON.parse(stored[key]);
            if (parsed && typeof parsed === 'object' && Array.isArray(parsed.completed)) return parsed;
          } catch (_) {}
        }
        return { completed: [], labs: {} };
      }
      window.FamAcademyBridge = {
        user: boot.user || (boot.userName ? { username: boot.userName } : null),
        allowedViews: boot.allowedViews || { panel: true, equipment: true },
        progress: readProgress(),
        async saveProgress(payload) {
          const safe = {
            completed: Array.isArray(payload?.completed) ? payload.completed.filter(x => typeof x === 'string') : [],
            labs: payload?.labs && typeof payload.labs === 'object' && !Array.isArray(payload.labs) ? payload.labs : {},
            selfAssessed: Array.isArray(payload?.selfAssessed) ? payload.selfAssessed.filter(x => typeof x === 'string') : [],
            profile: payload?.profile && typeof payload.profile === 'object' && !Array.isArray(payload.profile) ? {
              ...(this.progress?.profile || {}),
              ...payload.profile,
              level: ['beginner', 'intermediate', 'advanced'].includes(payload.profile.level) ? payload.profile.level : (this.progress?.profile?.level || 'beginner'),
              goal: typeof payload.profile.goal === 'string' && payload.profile.goal ? payload.profile.goal : 'fam-c5',
              minutesPerDay: Number.isFinite(Number(payload.profile.minutesPerDay)) ? Number(payload.profile.minutesPerDay) : 120,
              daysPerWeek: Number.isFinite(Number(payload.profile.daysPerWeek)) ? Number(payload.profile.daysPerWeek) : 7
            } : (this.progress?.profile || undefined)
          };
          try {
            localStorage.setItem('fam_academy_progress_v1', JSON.stringify(safe.completed));
          } catch (_) {}
          this.progress = safe;
          window.dispatchEvent(new CustomEvent('fam-academy-progress-updated', { detail: safe }));
          try {
            const response = await fetch('/api/academy/progress', {
              method: 'POST',
              credentials: 'same-origin',
              headers: { 'Content-Type': 'application/json', 'X-FAM-CSRF': csrf },
              body: JSON.stringify({ changes: { 'fam4.learn.v1': JSON.stringify(safe) } })
            });
            if (!response.ok) return false;
            this.progress = safe;
            return true;
          } catch (e) {
            return false;
          }
        },
        async evaluateQuiz(lessonId, answers) {
          if (!lessonId || !Array.isArray(answers)) return null;
          try {
            const response = await fetch('/api/academy/quiz/evaluate', {
              method: 'POST',
              credentials: 'same-origin',
              headers: { 'Content-Type': 'application/json', 'X-FAM-CSRF': csrf },
              body: JSON.stringify({ lessonId, answers })
            });
            if (!response.ok) return null;
            return await response.json();
          } catch (e) {
            return null;
          }
        },
        async evaluatePlacement(answers) {
          if (!answers || typeof answers !== 'object') return null;
          try {
            const response = await fetch('/api/academy/placement/evaluate', {
              method: 'POST',
              credentials: 'same-origin',
              headers: { 'Content-Type': 'application/json', 'X-FAM-CSRF': csrf },
              body: JSON.stringify({ answers })
            });
            if (!response.ok) return null;
            return await response.json();
          } catch (e) {
            return null;
          }
        }
      };
    })();
  </script>

  <script nonce="__FAM_CSP_NONCE__">
(() => {
  'use strict';
  const root = document.getElementById('app-root');
  let catalog = null;
  let restoreInitialHash = true;

  async function ensureCatalog() {
    if (catalog && Array.isArray(catalog.paths)) return catalog;
    const response = await fetch('/academy-assets/curriculum-catalog.json?v=20261124a', { credentials: 'same-origin', cache: 'no-store' });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const data = await response.json();
    if (!data || !Array.isArray(data.paths) || !window.FamAcademyCatalog) throw new Error('ساختار کاتالوگ معتبر نیست');
    catalog = data;
    return catalog;
  }

  function needsInitialPlacement() {
    const profile = window.FamAcademyBridge?.progress?.profile || {};
    return !profile.onboardingComplete || !profile.placementMode;
  }

  async function loadCatalog(openSelectedPath = false) {
    const requestId = String((Number(root.dataset.loadSequence) || 0) + 1);
    root.dataset.loadSequence = requestId;
    root.innerHTML = '<div class="fa-loading">در حال بارگذاری مسیرهای آموزشی…</div>';
    try {
      await ensureCatalog();
      if (root.dataset.loadSequence !== requestId) return;
      if (restoreInitialHash && location.hash === '#/tree') {
        restoreInitialHash = false;
        await window.FamAcademyCatalog.renderAcademyTree(root, catalog, openBlueprint, () => { location.hash = '#/dashboard'; });
        return;
      }
      if (restoreInitialHash && location.hash === '#/lessons') {
        restoreInitialHash = false;
        window.FamAcademyCatalog.renderLessonsIndex(root, catalog, openBlueprint, () => { location.hash = '#/dashboard'; });
        return;
      }
      if (restoreInitialHash && location.hash === '#/coverage') {
        restoreInitialHash = false;
        await window.FamAcademyCatalog.renderCommandCoverage(root, catalog, openBlueprint, () => { location.hash = '#/dashboard'; });
        return;
      }
      if (restoreInitialHash && location.hash === '#/glossary') {
        restoreInitialHash = false;
        await window.FamAcademyCatalog.renderGlossaryDirectory(root, catalog, openBlueprint, () => { location.hash = '#/dashboard'; });
        return;
      }
      if (restoreInitialHash && (location.hash === '#/simulators' || location.hash === '#/labs')) {
        restoreInitialHash = false;
        window.FamAcademySimUI?.render(root, {
          tab: location.hash === '#/labs' ? 'labs' : 'protocols',
          onBack: () => { location.hash = '#/dashboard'; }
        });
        return;
      }
      if (restoreInitialHash && location.hash === '#/placement') {
        restoreInitialHash = false;
        window.FamAcademyPlacement?.renderPlacementView(root, {
          onComplete: () => { location.hash = '#/dashboard'; loadCatalog(); },
          onCancel: () => { location.hash = '#/dashboard'; }
        });
        return;
      }
      if (restoreInitialHash && (!location.hash || location.hash === '#/dashboard') && needsInitialPlacement() && window.FamAcademyPlacement?.renderPlacementView) {
        restoreInitialHash = false;
        if (location.hash !== '#/placement') history.replaceState(null, '', '#/placement');
        window.FamAcademyPlacement.renderPlacementView(root, {
          onComplete: () => { location.hash = '#/dashboard'; loadCatalog(); },
          onCancel: () => { location.hash = '#/dashboard'; loadCatalog(); }
        });
        return;
      }
      window.FamAcademyCatalog.renderDashboard(root, catalog, openBlueprint);
      if (openSelectedPath || (restoreInitialHash && location.hash === '#/paths')) {
        restoreInitialHash = false;
        const goal = window.FamAcademyBridge?.progress?.profile?.goal || 'fam-c5';
        const path = catalog.paths.find(p => p.id === goal) || catalog.paths[0];
        if (path) window.FamAcademyCatalog.renderPathRoadmap(root, path, () => { location.hash = '#/dashboard'; }, openBlueprint, catalog);
        return;
      }
      if (restoreInitialHash && location.hash === '#/progress') {
        restoreInitialHash = false;
        window.FamJourney.renderProgress();
        return;
      }
      if (restoreInitialHash) {
        restoreInitialHash = false;
        const currentId = location.hash.slice(1);
        const current = catalog.paths.flatMap(p => (p.courses || []).flatMap(c => c.lessons || []))
          .find(lesson => lesson.id === currentId);
        if (current?.blueprint) openBlueprint(current.blueprint);
      }
    } catch (error) {
      if (root.dataset.loadSequence !== requestId) return;
      const errEl = document.createElement('div');
      errEl.className = 'fa-error';
      errEl.textContent = 'بارگذاری آکادمی انجام نشد: ' + String(error.message || error);
      root.replaceChildren(errEl);
    }
  }

  async function openDirectoryView(kind) {
    const requestId = String((Number(root.dataset.loadSequence) || 0) + 1);
    root.dataset.loadSequence = requestId;
    root.innerHTML = '<div class="fa-loading">در حال بارگذاری…</div>';
    try {
      await ensureCatalog();
      if (root.dataset.loadSequence !== requestId) return;
      const goHome = () => { location.hash = '#/dashboard'; };
      if (kind === 'tree') await window.FamAcademyCatalog.renderAcademyTree(root, catalog, openBlueprint, goHome);
      else if (kind === 'lessons') window.FamAcademyCatalog.renderLessonsIndex(root, catalog, openBlueprint, goHome);
      else if (kind === 'coverage') await window.FamAcademyCatalog.renderCommandCoverage(root, catalog, openBlueprint, goHome);
      else if (kind === 'glossary') await window.FamAcademyCatalog.renderGlossaryDirectory(root, catalog, openBlueprint, goHome);
      else if (kind === 'simulators' || kind === 'labs') {
        window.FamAcademySimUI?.render(root, { tab: kind === 'labs' ? 'labs' : 'protocols', onBack: goHome });
      } else if (kind === 'placement') {
        window.FamAcademyPlacement?.renderPlacementView(root, {
          onComplete: () => { location.hash = '#/dashboard'; loadCatalog(); },
          onCancel: goHome
        });
      }
    } catch (error) {
      if (root.dataset.loadSequence !== requestId) return;
      const errEl = document.createElement('div');
      errEl.className = 'fa-error';
      errEl.textContent = 'بارگذاری ناموفق بود: ' + String(error.message || error);
      root.replaceChildren(errEl);
    }
  }

  async function openBlueprint(url) {
    const requestId = String((Number(root.dataset.loadSequence) || 0) + 1);
    root.dataset.loadSequence = requestId;
    root.innerHTML = '<div id="bp-lesson-root" class="fa-lesson-loading">در حال آماده‌سازی درس…</div>';
    try {
      const response = await fetch(url, { credentials: 'same-origin', cache: 'no-store' });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const blueprint = await response.json();
      if (root.dataset.loadSequence !== requestId) return;
      if (!window.FamLessonEngine) throw new Error('موتور محتوای درس بارگذاری نشده است');
      window.FamLessonEngine.renderLesson(document.getElementById('bp-lesson-root'), blueprint, {
        catalog,
        onNavigate: url => {
          const all = catalog.paths.flatMap(p => (p.courses || []).flatMap(c => c.lessons || []));
          const next = all.find(item => item.blueprint === url);
          const isLessonHash = all.some(item => '#' + item.id === location.hash);
          if (next && isLessonHash && window.location.hash !== '#' + next.id) location.hash = next.id;
          else openBlueprint(url);
        },
        onBackToCatalog: () => {
          history.replaceState(null, '', '#/dashboard');
          window.scrollTo({ top: 0, behavior: 'auto' });
          loadCatalog();
        }
      });
      window.scrollTo({ top: 0, behavior: 'auto' });
    } catch (error) {
      if (root.dataset.loadSequence !== requestId) return;
      const errEl = document.createElement('div');
      errEl.className = 'fa-error';
      errEl.textContent = 'باز کردن درس ناموفق بود: ' + String(error.message || error);
      root.replaceChildren(errEl);
    }
  }

  window.addEventListener('hashchange', () => {
    if (location.hash === '#/progress') window.FamJourney.renderProgress();
    else if (location.hash === '#/dashboard' || !location.hash) loadCatalog();
    else if (location.hash === '#/paths') loadCatalog(true);
    else if (location.hash === '#/tree') openDirectoryView('tree');
    else if (location.hash === '#/lessons') openDirectoryView('lessons');
    else if (location.hash === '#/coverage') openDirectoryView('coverage');
    else if (location.hash === '#/glossary') openDirectoryView('glossary');
    else if (location.hash === '#/simulators') openDirectoryView('simulators');
    else if (location.hash === '#/labs') openDirectoryView('labs');
    else if (location.hash === '#/placement') openDirectoryView('placement');
    else if (location.hash.startsWith('#') && !location.hash.startsWith('#/')) {
      const targetId = decodeURIComponent(location.hash.slice(1));
      ensureCatalog().then(cat => {
        const match = (cat.paths || []).flatMap(p => (p.courses || []).flatMap(c => c.lessons || []))
          .find(item => item.id === targetId);
        if (match?.blueprint) openBlueprint(match.blueprint);
      }).catch(() => {});
    }
  });
  document.getElementById('btn-paths').onclick = () => loadCatalog();
  document.getElementById('btn-placement').onclick = () => openDirectoryView('placement');
  document.getElementById('btn-tree').onclick = () => openDirectoryView('tree');
  document.getElementById('btn-back-paths').onclick = () => loadCatalog();
  document.getElementById('btn-lessons').onclick = () => openDirectoryView('lessons');
  document.getElementById('btn-simulators').onclick = () => openDirectoryView('simulators');
  document.getElementById('btn-coverage').onclick = () => openDirectoryView('coverage');
  document.getElementById('btn-glossary').onclick = () => openDirectoryView('glossary');
  document.getElementById('btn-blueprint').onclick = async () => {
    try {
      const cat = await ensureCatalog();
      const first = (cat.paths || []).flatMap(x => (x.courses || []).flatMap(c => c.lessons || [])).find(l => l.blueprint);
      if (first) openBlueprint(first.blueprint);
    } catch (_) {}
  };
  loadCatalog();
})();
</script>

<div id="noc-search-wrap">
  <div class="noc-search-row">
    <input id="noc-search" type="search" placeholder="🔍 جست‌وجوی درس یا اصطلاح شبکه (مثلاً OSPF، VLAN، Routing Table)...">
    <select id="noc-filter-track">
      <option value="ALL">همه مسیرها</option>
      <option value="fam-c5">فقط Curriculum 5.0</option>
    </select>
  </div>
  <div id="noc-search-results"></div>
</div>
<script nonce="__FAM_CSP_NONCE__">
(() => {
  const inp = document.getElementById("noc-search");
  const sel = document.getElementById("noc-filter-track");
  const resBox = document.getElementById("noc-search-results");
  if (!inp || !sel || !resBox) return;
  let catCache = null;

  async function runFilter() {
    const q = inp.value.trim().toLowerCase();
    const track = sel.value;
    if (!catCache) {
      try { catCache = await (await fetch("/academy-assets/curriculum-catalog.json?v=20261124a", { credentials: "same-origin", cache: "no-store" })).json(); } catch { return; }
    }
    if (!q && track === "ALL") {
      resBox.style.display = "none";
      resBox.replaceChildren();
      return;
    }
    const frag = document.createDocumentFragment();
    let hitCount = 0;
    for (const p of (catCache.paths || [])) {
      if (track !== "ALL" && p.id !== track) continue;
      for (const c of (p.courses || [])) {
        for (const l of (c.lessons || [])) {
          const hay = [l.title, l.titleEn, l.id, l.summary, l.description, c.title, ...(Array.isArray(l.keywords) ? l.keywords : [])]
            .filter(Boolean).join(" ").toLowerCase();
          if (!q || hay.includes(q)) {
            hitCount++;
            const row = document.createElement("div");
            row.className = "noc-search-row-item";
            const link = document.createElement("a");
            link.href = "#" + l.id;
            link.className = "noc-search-hit";
            link.dataset.lesson = l.id;
            link.textContent = l.title;
            link.addEventListener("click", () => { resBox.style.display = "none"; });
            const meta = document.createElement("div");
            meta.className = "noc-search-meta";
            meta.textContent = p.title + " · " + c.title;
            const summary = document.createElement("div");
            summary.className = "noc-search-summary";
            summary.textContent = l.summary || l.description || c.title;
            row.append(link, meta, summary);
            frag.appendChild(row);
          }
        }
      }
    }
    resBox.replaceChildren();
    if (hitCount) {
      resBox.appendChild(frag);
    } else {
      const empty = document.createElement("div");
      empty.id = "noc-search-empty";
      empty.className = "noc-search-meta";
      empty.textContent = "موردی یافت نشد.";
      resBox.appendChild(empty);
    }
    resBox.style.display = "block";
  }

  inp.addEventListener("input", runFilter);
  sel.addEventListener("change", runFilter);
  inp.addEventListener("keydown", e => {
    if (e.key === "Escape") { resBox.style.display = "none"; inp.blur(); }
  });
  document.addEventListener("click", e => {
    if (!e.target.closest("#noc-search-wrap")) resBox.style.display = "none";
  });
})();
</script>
