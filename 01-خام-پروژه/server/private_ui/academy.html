<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="آکادمی فام — آموزش تعاملی شبکه، پروتکلها و Cisco IOS">
  <meta name="fam-academy-legacy-progress-key" content="fam3.progress.v1">

  <link rel="stylesheet" href="/academy-assets/academy-v2.css?v=20261124p0">
  <script nonce="__FAM_CSP_NONCE__">
    window.FAM_ACADEMY_BOOTSTRAP = __FAM_ACADEMY_BOOTSTRAP__;
    (function () {
      try {
        var saved = localStorage.getItem('fam.academy.theme');
        if (saved !== 'light' && saved !== 'dark') {
          var famTheme = localStorage.getItem('fam.ui.theme');
          saved = famTheme === 'light' ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = saved;
      } catch (_) {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>
  <script defer src="/academy-assets/academy-engine.js?v=20261124p0"></script>
  <script defer src="/academy-assets/academy-v2.js?v=20261124p0"></script>
</head>

  <main id="fam-app" class="page" aria-live="polite" tabindex="-1">
    <div class="loading">در حال بارگذاری آکادمی فام…</div>
  </main>
  <noscript>
    <div class="error-box">برای استفاده از داشبورد، درسها، شبیهسازها و آزمونها باید JavaScript فعال باشد.</div>
  </noscript>
</body>
</html>
