<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="t d"><title id="t">OSPF broadcast DR and BDR election</title><desc id="d">Three routers on one broadcast LAN in area 0. R3 has priority 200 and is expected to become DR, R2 the BDR, R1 stays 2-WAY. Proposed design not executed.</desc><rect width="1000" height="360" fill="#f4f7fb"/><g fill="#dfe9f4" stroke="#244e78" stroke-width="3"><rect x="120" y="215" width="760" height="58" rx="8"/></g><g fill="white" stroke="#244e78" stroke-width="3"><rect x="70" y="70" width="220" height="100" rx="10"/><rect x="390" y="70" width="220" height="100" rx="10"/><rect x="710" y="70" width="220" height="100" rx="10"/></g><g fill="none" stroke="#145b91" stroke-width="3"><path d="M180 170V215"/><path d="M500 170V215"/><path d="M820 170V215"/></g><g font-family="sans-serif" fill="#102b46" text-anchor="middle"><text x="500" y="36" font-size="22">OSPF broadcast LAN — DR and BDR</text><text x="180" y="110" font-size="20">R1</text><text x="180" y="138" font-size="15">Router ID 1.1.1.1</text><text x="180" y="160" font-size="15">priority 1</text><text x="500" y="110" font-size="20">R2</text><text x="500" y="138" font-size="15">Router ID 2.2.2.2</text><text x="500" y="160" font-size="15">priority 1</text><text x="820" y="110" font-size="20">R3</text><text x="820" y="138" font-size="15">Router ID 3.3.3.3</text><text x="820" y="160" font-size="15">priority 200</text><text x="500" y="247" font-size="16">192.0.2.0/24 — area 0</text><text x="500" y="308" font-size="16">Expected: R3 = DR, R2 = BDR, R1 = 2-WAY</text><text x="500" y="338" font-size="15">Proposed design — not executed</text></g></svg>
