<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc"><title id="title">Ethernet media: shared and point-to-point</title><desc id="desc">Shared media can have multiple participants; a point-to-point Ethernet link has two endpoints. Conceptual untested diagram.</desc><rect width="1000" height="340" fill="#f5f8fc"/><g font-family="sans-serif" fill="#152e4b" text-anchor="middle"><text x="500" y="35" font-size="22">Ethernet media — conceptual examples</text><text x="130" y="110" font-size="18">Shared media</text><text x="130" y="235" font-size="18">Point-to-point</text><text x="500" y="315" font-size="16">Physical link type is not automatically OSPF network type</text></g><g fill="#fff" stroke="#244e78" stroke-width="3"><rect x="260" y="75" width="150" height="60" rx="9"/><rect x="500" y="75" width="150" height="60" rx="9"/><rect x="740" y="75" width="150" height="60" rx="9"/><rect x="330" y="205" width="160" height="60" rx="9"/><rect x="650" y="205" width="160" height="60" rx="9"/></g><g stroke="#145b91" stroke-width="4"><path d="M410 105H500M650 105H740M490 235H650"/></g><g font-family="sans-serif" fill="#152e4b" text-anchor="middle" font-size="18"><text x="335" y="112">Host A</text><text x="575" y="112">Shared medium</text><text x="815" y="112">Hosts B/C</text><text x="410" y="242">Switch 1</text><text x="730" y="242">Switch 2</text></g></svg>
