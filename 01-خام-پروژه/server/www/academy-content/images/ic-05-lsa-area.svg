<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="t d"><title id="t">OSPF areas and LSA types</title><desc id="d">Area 0 backbone with an ABR connecting Area 1. Each router holds a link-state database built from LSAs. Conceptual diagram, not a tested topology.</desc><rect width="1000" height="360" fill="#f4f7fb"/><g fill="none" stroke="#244e78" stroke-width="3" stroke-dasharray="7 5"><rect x="40" y="80" width="420" height="200" rx="14"/><rect x="540" y="80" width="420" height="200" rx="14"/></g><g fill="white" stroke="#244e78" stroke-width="3"><rect x="90" y="140" width="130" height="80" rx="10"/><rect x="250" y="140" width="130" height="80" rx="10"/><rect x="780" y="140" width="130" height="80" rx="10"/></g><g fill="#dfe9f4" stroke="#244e78" stroke-width="3"><rect x="430" y="140" width="140" height="80" rx="10"/></g><g fill="none" stroke="#145b91" stroke-width="3"><path d="M220 180H250"/><path d="M380 180H430"/><path d="M570 180H780"/></g><g font-family="sans-serif" fill="#102b46" text-anchor="middle"><text x="500" y="34" font-size="22">Areas, ABR and the link-state database</text><text x="250" y="63" font-size="16">Area 0 — backbone</text><text x="750" y="63" font-size="16">Area 1</text><text x="155" y="175" font-size="18">R1</text><text x="155" y="200" font-size="13">LSDB</text><text x="315" y="175" font-size="18">R2</text><text x="315" y="200" font-size="13">LSDB</text><text x="500" y="172" font-size="16">ABR</text><text x="500" y="196" font-size="13">summarises</text><text x="845" y="175" font-size="18">R3</text><text x="845" y="200" font-size="13">LSDB</text><text x="500" y="312" font-size="15">Router LSA · Network LSA · Summary LSA</text><text x="500" y="340" font-size="15">Conceptual model — not executed</text></g></svg>
