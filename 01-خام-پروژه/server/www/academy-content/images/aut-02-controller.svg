<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="t d">
<title id="t">Traditional and Controller-Based networking comparison</title>
<desc id="d">Conceptual and unexecuted comparison. Traditional networking distributes control functions across devices. In a controller-based architecture, a logical controller can aggregate policy and management, while devices usually retain local forwarding. A dashed management/control channel connects the controller to devices. User traffic normally traverses device data planes, not the controller; behavior during controller loss depends on installed state, timeouts and fail mode. High availability can reduce but does not eliminate central dependency.</desc>
<defs>
  <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#145b91"/></marker>
  <marker id="darr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8a5a00"/></marker>
</defs>
<rect width="1100" height="480" fill="#f4f7fb"/>
<text x="550" y="34" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="bold" fill="#102b46">Distributed control and Controller-Based policy</text>
<rect x="45" y="82" width="315" height="150" rx="12" fill="#ffffff" stroke="#244e78" stroke-width="3"/>
<text x="202" y="116" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#102b46">Traditional / distributed</text>
<text x="202" y="151" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#102b46">local Control on each device</text>
<text x="202" y="178" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#102b46">protocols exchange state</text>
<text x="202" y="207" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#102b46">CLI, scripts or config management</text>
<rect x="410" y="82" width="280" height="150" rx="12" fill="#fff4d9" stroke="#8a5a00" stroke-width="3"/>
<text x="550" y="116" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#102b46">Logical Controller</text>
<text x="550" y="151" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#102b46">aggregates policy / telemetry</text>
<text x="550" y="179" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#102b46">view may be partial or stale</text>
<text x="550" y="207" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#102b46">HA / scale are design choices</text>
<rect x="740" y="82" width="315" height="150" rx="12" fill="#dff1e7" stroke="#287345" stroke-width="3"/>
<text x="897" y="116" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#102b46">Network devices</text>
<text x="897" y="151" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#102b46">local Data Plane forwards traffic</text>
<text x="897" y="179" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#102b46">some local Control usually remains</text>
<text x="897" y="207" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#102b46">installed state / timeouts matter</text>
<path d="M690 155 H735" fill="none" stroke="#8a5a00" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#darr)"/>
<text x="713" y="145" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#704900">API</text>
<rect x="180" y="300" width="260" height="58" rx="10" fill="#ffffff" stroke="#145b91" stroke-width="2"/>
<rect x="660" y="300" width="260" height="58" rx="10" fill="#ffffff" stroke="#145b91" stroke-width="2"/>
<text x="310" y="336" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#102b46">User traffic source</text>
<text x="790" y="336" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#102b46">User traffic destination</text>
<path d="M440 329 H550 V270 H897 V235" fill="none" stroke="#145b91" stroke-width="4" marker-end="url(#arr)"/>
<path d="M897 235 V270 H790 V295" fill="none" stroke="#145b91" stroke-width="4" marker-end="url(#arr)"/>
<text x="550" y="400" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#102b46">Controller loss: existing forwarding may persist; new decisions depend on fail mode and design</text>
<text x="550" y="450" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#102b46">Conceptual design — not executed; HA reduces some risks, not policy errors</text>
</svg>
