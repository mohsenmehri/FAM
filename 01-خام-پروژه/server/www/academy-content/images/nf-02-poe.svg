<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="t d"><title id="t">PoE: separate power and data flows</title><desc id="d">Power and data travel through the same Ethernet cable between PSE switch and powered AP; data also connects AP and client. Diagram is conceptual and untested.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#b45309"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="#145b91"/></marker></defs><rect width="1000" height="320" fill="#f4f7fb"/><g fill="#fff" stroke="#244e78" stroke-width="3"><rect x="30" y="90" width="200" height="115" rx="10"/><rect x="400" y="90" width="200" height="115" rx="10"/><rect x="770" y="90" width="200" height="115" rx="10"/></g><g font-family="sans-serif" text-anchor="middle" fill="#102b46"><text x="500" y="35" font-size="22">PoE: two functions over one Ethernet cable</text><text x="130" y="132" font-size="20">Switch / PSE</text><text x="130" y="163" font-size="15">shared power budget</text><text x="500" y="132" font-size="20">Access Point / PD</text><text x="500" y="163" font-size="15">receives power</text><text x="870" y="132" font-size="20">Wireless Client</text><text x="315" y="98" font-size="15" fill="#b45309">POWER →</text><text x="315" y="197" font-size="15" fill="#145b91">DATA ↔</text><text x="685" y="220" font-size="15" fill="#145b91">DATA ↔ Wi-Fi</text><text x="500" y="255" font-size="16">Conceptual diagram — not an electrical test</text></g><path d="M230 115H390" stroke="#b45309" stroke-width="4" marker-end="url(#a)"/><path d="M240 180H390" stroke="#145b91" stroke-width="4" marker-start="url(#b)" marker-end="url(#b)"/><path d="M610 180H760" stroke="#145b91" stroke-width="4" marker-start="url(#b)" marker-end="url(#b)"/></svg>
