<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="t d">
<title id="t">Management transports and AAA backend</title>
<desc id="d">An administrator reaches a managed device using SSH or HTTPS, or uses the local console. The device may consult a RADIUS or TACACS+ server for AAA. AAA is a backend protocol, not an administrator transport. Telnet and HTTP are unencrypted.</desc>
<defs>
  <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#145b91"/></marker>
  <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b45309"/></marker>
</defs>
<rect width="1000" height="430" fill="#f4f7fb"/>
<g fill="none" stroke-width="3">
  <path d="M255 165H385" stroke="#145b91" marker-end="url(#arrow-blue)"/>
  <path d="M615 165H745" stroke="#b45309" stroke-dasharray="7 6" marker-start="url(#arrow-orange)" marker-end="url(#arrow-orange)"/>
  <path d="M500 285V215" stroke="#145b91" marker-end="url(#arrow-blue)"/>
</g>
<g fill="white" stroke="#244e78" stroke-width="3">
  <rect x="45" y="120" width="210" height="90" rx="10"/>
  <rect x="385" y="120" width="230" height="95" rx="10"/>
  <rect x="745" y="120" width="210" height="90" rx="10"/>
  <rect x="385" y="285" width="230" height="70" rx="10"/>
</g>
<g font-family="sans-serif" fill="#102b46" text-anchor="middle">
  <text x="500" y="36" font-size="22">Management transports and AAA backend</text>
  <text x="150" y="155" font-size="17">Administrator</text>
  <text x="150" y="181" font-size="13">management client</text>
  <text x="320" y="150" font-size="14">SSH / HTTPS</text>
  <text x="500" y="154" font-size="18">Managed device</text>
  <text x="500" y="180" font-size="14">Router · Switch · WLC</text>
  <text x="500" y="200" font-size="12">local or AAA policy</text>
  <text x="680" y="108" font-size="13">AAA exchange</text>
  <text x="850" y="155" font-size="17">AAA server</text>
  <text x="850" y="181" font-size="14">RADIUS / TACACS+</text>
  <text x="500" y="314" font-size="17">Console port</text>
  <text x="500" y="338" font-size="13">local / out-of-band</text>
  <text x="500" y="386" font-size="14">AAA is a backend protocol, not an administrator transport</text>
  <text x="500" y="410" font-size="14">Telnet and HTTP are unencrypted; normally disable them</text>
</g>
</svg>
