<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="330" viewBox="0 0 1050 330" role="img" aria-labelledby="t d"><title id="t">Router-on-a-stick lab</title><desc id="d">Two clients on VLAN 10 and VLAN 20 connect to SW1, which trunks to R1 using subinterfaces .10 and .20 with gateway addresses. Untested.</desc><rect width="1050" height="330" fill="#f4f7fb"/><g fill="white" stroke="#244e78" stroke-width="3"><rect x="35" y="55" width="225" height="85" rx="10"/><rect x="35" y="190" width="225" height="85" rx="10"/><rect x="380" y="120" width="200" height="85" rx="10"/><rect x="720" y="100" width="285" height="125" rx="10"/></g><g fill="none" stroke="#145b91" stroke-width="4"><path d="M260 97L380 145M260 232L380 180M580 162H720"/></g><g font-family="sans-serif" fill="#102b46" text-anchor="middle"><text x="525" y="28" font-size="21">Inter-VLAN — router-on-a-stick</text><text x="147" y="90" font-size="18">PC-A VLAN 10</text><text x="147" y="117" font-size="15">192.0.2.10/24</text><text x="147" y="225" font-size="18">PC-B VLAN 20</text><text x="147" y="252" font-size="15">198.51.100.10/24</text><text x="480" y="155" font-size="20">SW1</text><text x="480" y="182" font-size="14">Gi0/1, Gi0/2, Gi0/24</text><text x="650" y="145" font-size="15">Trunk</text><text x="862" y="129" font-size="18">R1 Gi0/0</text><text x="862" y="157" font-size="15">.10 → 192.0.2.1/24</text><text x="862" y="183" font-size="15">.20 → 198.51.100.1/24</text><text x="525" y="307" font-size="15">Proposed PNETLab design — not executed</text></g></svg>
