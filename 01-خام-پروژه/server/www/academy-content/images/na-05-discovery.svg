<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="t d"><title id="t">CDP and LLDP neighbour discovery on both switches</title><desc id="d">Both switches enable CDP and LLDP. Each protocol is independently sent and received on both ends. Proposed design, not executed.</desc><rect width="1000" height="380" fill="#f4f7fb"/><g fill="none" stroke="#145b91" stroke-width="3"><path d="M300 170H385"/><path d="M615 170H700"/></g><g fill="white" stroke="#244e78" stroke-width="3"><rect x="70" y="120" width="230" height="100" rx="10"/><rect x="700" y="120" width="230" height="100" rx="10"/></g><g fill="#dfe9f4" stroke="#244e78" stroke-width="3"><rect x="385" y="120" width="230" height="100" rx="10"/></g><g font-family="sans-serif" fill="#102b46" text-anchor="middle"><text x="500" y="36" font-size="22">CDP and LLDP neighbour discovery</text><text x="185" y="158" font-size="19">SW1</text><text x="185" y="185" font-size="13">CDP + LLDP enabled</text><text x="500" y="158" font-size="19">Gi0/1 ↔ Gi0/1</text><text x="500" y="185" font-size="13">same protocol both ends</text><text x="815" y="158" font-size="19">SW2</text><text x="815" y="185" font-size="13">CDP + LLDP enabled</text><text x="500" y="270" font-size="15">CDP Cisco-only · LLDP vendor-neutral · TX/RX both ends</text><text x="500" y="362" font-size="15">Proposed design — not executed</text></g></svg>