<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="t d"><title id="t">NGFW and inline IPS conceptual placement</title><desc id="d">Client traffic passes through the NGFW and inline IPS to the server; IDS may observe a copy. Conceptual design and untested.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#145b91"/></marker></defs><rect width="1000" height="300" fill="#f4f7fb"/><g fill="white" stroke="#244e78" stroke-width="3"><rect x="30" y="80" width="170" height="75" rx="10"/><rect x="380" y="80" width="240" height="75" rx="10"/><rect x="800" y="80" width="170" height="75" rx="10"/><rect x="390" y="195" width="220" height="65" rx="10"/></g><g font-family="sans-serif" text-anchor="middle" fill="#102b46"><text x="500" y="35" font-size="21">NGFW / IPS: illustrative inline design</text><text x="115" y="125" font-size="19">Client</text><text x="500" y="112" font-size="19">NGFW + inline IPS</text><text x="500" y="137" font-size="14">inspect / policy action</text><text x="885" y="125" font-size="19">Server</text><text x="500" y="232" font-size="18">IDS: observes copy</text><text x="500" y="283" font-size="14">IDS copy is conceptual; mirror point and topology vary</text></g><g fill="none" stroke="#145b91" stroke-width="4"><path d="M200 118H370" marker-end="url(#a)"/><path d="M620 118H790" marker-end="url(#a)"/><path d="M290 118V228H380" stroke-dasharray="8 5" marker-end="url(#a)"/></g></svg>
