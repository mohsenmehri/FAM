<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc"><title id="title">Inspect both ends of a switch link</title><desc id="desc">Two switches connected through Gi0/1; speed, duplex, and errors must be checked on both sides. Example not executed.</desc><rect width="1000" height="260" fill="#f5f8fc"/><g font-family="sans-serif" fill="#152e4b" text-anchor="middle"><text x="500" y="32" font-size="22">Interface troubleshooting — proposed lab</text><text x="200" y="123" font-size="20">SW1 Gi0/1</text><text x="800" y="123" font-size="20">SW2 Gi0/1</text><text x="500" y="105" font-size="17">Ethernet link</text><text x="500" y="185" font-size="17">Compare speed, duplex and counter changes on both ends</text><text x="500" y="225" font-size="15">Untested; physical cable quality is not validated in PNETLab</text></g><g fill="none" stroke="#244e78" stroke-width="3"><rect x="90" y="78" width="220" height="75" rx="9"/><rect x="690" y="78" width="220" height="75" rx="9"/><path d="M310 115H690"/></g></svg>
