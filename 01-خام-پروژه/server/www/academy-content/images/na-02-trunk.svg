<rect x="320" y="110" width="190" height="190" rx="12"/><rect x="650" y="110" width="190" height="190" rx="12"/>
<rect x="925" y="65" width="205" height="80" rx="10"/><rect x="925" y="235" width="205" height="80" rx="10"/>
</g>
