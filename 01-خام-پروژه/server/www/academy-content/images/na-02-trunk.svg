<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="390" viewBox="0 0 1160 390" role="img" aria-labelledby="t d">
<title id="t">Two-switch 802.1Q trunk worksheet with two VLANs</title>
<desc id="d">Proposed and unexecuted topology. PC-A in VLAN 10 and PC-D in VLAN 20 connect to SW1. PC-B in VLAN 10 and PC-C in VLAN 20 connect to SW2. SW1 Gi0/24 and SW2 Gi0/24 form an 802.1Q trunk allowing VLANs 10, 20, and 999, with native VLAN 999 on both ends.</desc>
