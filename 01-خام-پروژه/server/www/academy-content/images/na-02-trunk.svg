<text x="132" y="268" font-size="18">PC-D · VLAN 20</text><text x="132" y="294" font-size="14">198.51.100.11/24</text>
<text x="415" y="170" font-size="21" font-weight="bold">SW1</text><text x="415" y="200" font-size="15">Gi0/1 · VLAN 10</text><text x="415" y="230" font-size="15">Gi0/2 · VLAN 20</text><text x="415" y="265" font-size="15">Gi0/24 · Trunk</text>
<text x="745" y="170" font-size="21" font-weight="bold">SW2</text><text x="745" y="200" font-size="15">Gi0/1 · VLAN 10</text><text x="745" y="230" font-size="15">Gi0/2 · VLAN 20</text><text x="745" y="265" font-size="15">Gi0/24 · Trunk</text>
<text x="1027" y="98" font-size="18">PC-B · VLAN 10</text><text x="1027" y="124" font-size="14">192.0.2.11/24</text>
