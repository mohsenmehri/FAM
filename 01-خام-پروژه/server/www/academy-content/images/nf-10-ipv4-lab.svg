<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc">
<title id="title">IPv4 subnetting and routed two-LAN worksheet</title>
<desc id="desc">Proposed and unexecuted PNETLab topology: PC-A 192.0.2.10 slash 27 through SW-A to R1 Gi0/0 192.0.2.1 slash 27; R1 Gi0/1 192.0.2.33 slash 27 through SW-B to PC-B 192.0.2.40 slash 27. Parent block is 192.0.2.0 slash 26. Each subnet is a separate LAN.</desc>
<rect width="1120" height="360" fill="#f5f8fc"/>
<g fill="#fff" stroke="#244e78" stroke-width="3">
<rect x="35" y="115" width="170" height="100" rx="12"/><rect x="245" y="115" width="150" height="100" rx="12"/>
<rect x="475" y="90" width="180" height="150" rx="18"/><rect x="725" y="115" width="150" height="100" rx="12"/><rect x="915" y="115" width="170" height="100" rx="12"/>
</g>
<g stroke="#145b91" stroke-width="4" fill="none"><path d="M205 165H245M395 165H475M655 145H725M875 165H915"/></g>
<g font-family="sans-serif" fill="#152e4b" text-anchor="middle">
<text x="560" y="35" font-size="23" font-weight="bold">IPv4 subnetting — two routed /27 LANs</text>
<text x="120" y="150" font-size="19">PC-A</text><text x="120" y="180" font-size="16">192.0.2.10/27</text>
<text x="320" y="150" font-size="19">SW-A</text><text x="320" y="180" font-size="15">LAN-A</text>
<text x="565" y="130" font-size="20" font-weight="bold">R1</text><text x="565" y="160" font-size="15">Gi0/0 · 192.0.2.1/27</text><text x="565" y="195" font-size="15">Gi0/1 · 192.0.2.33/27</text>
<text x="800" y="150" font-size="19">SW-B</text><text x="800" y="180" font-size="15">LAN-B</text>
<text x="1000" y="150" font-size="19">PC-B</text><text x="1000" y="180" font-size="16">192.0.2.40/27</text>
<text x="315" y="250" font-size="15">192.0.2.0/27 · usable .1–.30</text><text x="800" y="250" font-size="15">192.0.2.32/27 · usable .33–.62</text>
<text x="560" y="295" font-size="17">Parent block: 192.0.2.0/26 — proposed worksheet, not executed</text>
</g></svg>
