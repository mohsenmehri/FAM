<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" role="img" aria-labelledby="t d">
<title id="t">MAC learning, unknown-unicast flooding, and known-unicast forwarding</title>
<desc id="d">Two-stage example on a four-host VLAN 10 switch. First, PC-A sends an unknown unicast for PC-B. SW1 learns A from ingress Gi0/1 and floods eligible VLAN 10 ports Gi0/2 through Gi0/4, not the ingress port. When PC-B replies, SW1 learns B on Gi0/2; a later frame for known PC-A is forwarded only to Gi0/1. Proposed design, not executed.</desc>
<defs>
  <marker id="arrow-in" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#145b91"/></marker>
  <marker id="arrow-flood" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#287345"/></marker>
  <marker id="arrow-known" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b45309"/></marker>
</defs>
<rect width="1240" height="560" fill="#f4f7fb"/>
<g font-family="sans-serif" fill="#102b46" text-anchor="middle">
  <text x="620" y="37" font-size="23">MAC learning, unknown-unicast flooding, and forwarding</text>
  <text x="620" y="65" font-size="15">Learn the source MAC on ingress; look up the destination within its VLAN</text>
</g>
<g fill="#ffffff" stroke="#c3d2df" stroke-width="2">
  <rect x="20" y="85" width="590" height="390" rx="14"/>
  <rect x="630" y="85" width="590" height="390" rx="14"/>
</g>
<g font-family="sans-serif" fill="#102b46" text-anchor="middle">
  <text x="315" y="119" font-size="17" font-weight="bold">Step 1 — PC-A sends an unknown unicast for PC-B</text>
  <text x="925" y="119" font-size="17" font-weight="bold">Step 2 — PC-B replies to known PC-A</text>
</g>
<g fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  <!-- Unknown unicast: input from A, then copies to all eligible VLAN ports except ingress. -->
  <path d="M175 235H245" stroke="#145b91" marker-end="url(#arrow-in)"/>
  <path d="M390 208H418V170H455" stroke="#287345" marker-end="url(#arrow-flood)"/>
  <path d="M390 235H430V250H455" stroke="#287345" marker-end="url(#arrow-flood)"/>
  <path d="M390 262H442V330H455" stroke="#287345" marker-end="url(#arrow-flood)"/>
  <!-- Physical links in the second state are gray; only the known destination gets a frame. -->
  <path d="M785 235H855" stroke="#145b91" marker-end="url(#arrow-in)"/>
  <path d="M1000 208H1025V170H1065" stroke="#9aa9b7"/>
  <path d="M1000 235H1040V250H1065" stroke="#b45309" marker-end="url(#arrow-known)"/>
  <path d="M1000 262H1025V330H1065" stroke="#9aa9b7"/>
</g>
<g fill="#ffffff" stroke="#244e78" stroke-width="3">
  <!-- Step 1 hosts and switch -->
  <rect x="50" y="205" width="125" height="60" rx="9"/>
  <rect x="245" y="190" width="145" height="90" rx="10" fill="#dfe9f4"/>
  <rect x="455" y="140" width="125" height="60" rx="9"/>
  <rect x="455" y="220" width="125" height="60" rx="9"/>
  <rect x="455" y="300" width="125" height="60" rx="9"/>
  <!-- Step 2 hosts and switch -->
  <rect x="660" y="205" width="125" height="60" rx="9"/>
  <rect x="855" y="190" width="145" height="90" rx="10" fill="#dfe9f4"/>
  <rect x="1065" y="140" width="125" height="60" rx="9"/>
  <rect x="1065" y="220" width="125" height="60" rx="9"/>
  <rect x="1065" y="300" width="125" height="60" rx="9"/>
</g>
<g font-family="sans-serif" fill="#102b46" text-anchor="middle">
  <!-- Step 1 labels -->
  <text x="112" y="229" font-size="17">PC-A</text><text x="112" y="251" font-size="12">Gi0/1 · VLAN 10</text>
  <text x="317" y="226" font-size="19">SW1</text><text x="317" y="251" font-size="13">MAC table</text>
  <text x="517" y="164" font-size="17">PC-B</text><text x="517" y="186" font-size="12">Gi0/2 · VLAN 10</text>
  <text x="517" y="244" font-size="17">PC-C</text><text x="517" y="266" font-size="12">Gi0/3 · VLAN 10</text>
  <text x="517" y="324" font-size="17">PC-D</text><text x="517" y="346" font-size="12">Gi0/4 · VLAN 10</text>
  <!-- Step 2 labels -->
  <text x="722" y="229" font-size="17">PC-B</text><text x="722" y="251" font-size="12">Gi0/2 · VLAN 10</text>
  <text x="927" y="226" font-size="19">SW1</text><text x="927" y="251" font-size="13">MAC table</text>
  <text x="1127" y="164" font-size="17">PC-C</text><text x="1127" y="186" font-size="12">Gi0/3 · VLAN 10</text>
  <text x="1127" y="244" font-size="17">PC-A</text><text x="1127" y="266" font-size="12">Gi0/1 · VLAN 10</text>
  <text x="1127" y="324" font-size="17">PC-D</text><text x="1127" y="346" font-size="12">Gi0/4 · VLAN 10</text>
  <!-- Explanatory captions -->
  <text x="315" y="413" font-size="14">Learn A on Gi0/1 · Flood eligible VLAN 10 ports Gi0/2–Gi0/4</text>
  <text x="925" y="413" font-size="14">Learn B on Gi0/2 · A is known → output only Gi0/1</text>
  <text x="620" y="511" font-size="14">Flooding excludes ingress and ineligible/blocked ports; it stays within the VLAN.</text>
  <text x="620" y="540" font-size="14">Proposed PNETLab design — not executed</text>
</g>
</svg>
