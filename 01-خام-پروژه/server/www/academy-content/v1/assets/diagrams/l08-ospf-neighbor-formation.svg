<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" role="img" aria-labelledby="t d" dir="rtl">
<title id="t">OSPF Neighbor Formation و ماشین حالتها</title>
<desc id="d">ماشین حالت OSPF و پارامترهایی که باید دو سر یکسان باشند.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/></marker>
<linearGradient id="node" x1="0" x2="1"><stop offset="0" stop-color="#17233c"/><stop offset="1" stop-color="#22345a"/></linearGradient></defs>
<rect x="1" y="1" width="858" height="278" rx="18" fill="#0b1220" stroke="#25334d"/>
<line x1="90" y1="140" x2="250" y2="140" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" opacity="0.85"/>
<text x="170" y="132" fill="#93a4c3" font-size="12" text-anchor="middle" direction="rtl">Hello</text>
<line x1="250" y1="140" x2="410" y2="140" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" opacity="0.85"/>
<text x="330" y="132" fill="#93a4c3" font-size="12" text-anchor="middle" direction="rtl">2-way check</text>
<line x1="410" y1="140" x2="570" y2="140" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" opacity="0.85"/>
<text x="490" y="132" fill="#93a4c3" font-size="12" text-anchor="middle" direction="rtl">DR election</text>
<line x1="570" y1="140" x2="760" y2="140" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" opacity="0.85"/>
<text x="665" y="132" fill="#93a4c3" font-size="12" text-anchor="middle" direction="rtl">LSR/LSU</text>
<rect x="16" y="106" width="148" height="68" rx="14" fill="url(#node)" stroke="#3b4d72"/>
<text x="90" y="136" fill="#e6edf7" font-size="14" font-weight="700" text-anchor="middle" direction="rtl">Down</text>
<text x="90" y="158" fill="#93a4c3" font-size="11" text-anchor="middle" direction="ltr">no Hello</text>
<rect x="176" y="106" width="148" height="68" rx="14" fill="url(#node)" stroke="#3b4d72"/>
<text x="250" y="136" fill="#e6edf7" font-size="14" font-weight="700" text-anchor="middle" direction="rtl">Init</text>
<text x="250" y="158" fill="#93a4c3" font-size="11" text-anchor="middle" direction="ltr">Hello seen</text>
<rect x="336" y="106" width="148" height="68" rx="14" fill="url(#node)" stroke="#3b4d72"/>
<text x="410" y="136" fill="#e6edf7" font-size="14" font-weight="700" text-anchor="middle" direction="rtl">2-Way</text>
<text x="410" y="158" fill="#93a4c3" font-size="11" text-anchor="middle" direction="ltr">DR/BDR</text>
<rect x="496" y="106" width="148" height="68" rx="14" fill="url(#node)" stroke="#3b4d72"/>
<text x="570" y="136" fill="#e6edf7" font-size="14" font-weight="700" text-anchor="middle" direction="rtl">ExStart/Exchange</text>
<text x="570" y="158" fill="#93a4c3" font-size="11" text-anchor="middle" direction="ltr">DBD / MTU</text>
<rect x="686" y="106" width="148" height="68" rx="14" fill="url(#node)" stroke="#3b4d72"/>
<text x="760" y="136" fill="#e6edf7" font-size="14" font-weight="700" text-anchor="middle" direction="rtl">Full</text>
<text x="760" y="158" fill="#93a4c3" font-size="11" text-anchor="middle" direction="ltr">LSDB sync</text>
</svg>
