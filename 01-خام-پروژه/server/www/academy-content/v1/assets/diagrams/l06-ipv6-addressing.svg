<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" role="img" aria-labelledby="t d" dir="rtl">
<title id="t">IPv6 Addressing، SLAAC و Neighbor Discovery</title>
<desc id="d">Router Advertisement، SLAAC و Neighbor Solicitation در یک لینک IPv6.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/></marker>
<linearGradient id="node" x1="0" x2="1"><stop offset="0" stop-color="#17233c"/><stop offset="1" stop-color="#22345a"/></linearGradient></defs>
<rect x="1" y="1" width="858" height="278" rx="18" fill="#0b1220" stroke="#25334d"/>
<line x1="140" y1="140" x2="700" y2="140" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" opacity="0.85"/>
<text x="420" y="132" fill="#93a4c3" font-size="12" text-anchor="middle" direction="rtl">RA: 2001:db8:1::/64</text>
<line x1="700" y1="140" x2="140" y2="140" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" opacity="0.85"/>
<text x="420" y="132" fill="#93a4c3" font-size="12" text-anchor="middle" direction="rtl">NS / NA (NDP)</text>
<rect x="66" y="106" width="148" height="68" rx="14" fill="url(#node)" stroke="#3b4d72"/>
<text x="140" y="136" fill="#e6edf7" font-size="14" font-weight="700" text-anchor="middle" direction="rtl">Router</text>
<text x="140" y="158" fill="#93a4c3" font-size="11" text-anchor="middle" direction="ltr">2001:db8:1::1</text>
<rect x="626" y="106" width="148" height="68" rx="14" fill="url(#node)" stroke="#3b4d72"/>
<text x="700" y="136" fill="#e6edf7" font-size="14" font-weight="700" text-anchor="middle" direction="rtl">Host</text>
<text x="700" y="158" fill="#93a4c3" font-size="11" text-anchor="middle" direction="ltr">SLAAC EUI-64 / random</text>
