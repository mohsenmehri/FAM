<text x="690" y="136" fill="#e6edf7" font-size="14" font-weight="700" text-anchor="middle" direction="rtl">SW2</text>
<text x="690" y="158" fill="#93a4c3" font-size="11" text-anchor="middle" direction="ltr">Gi0/24 trunk</text>
