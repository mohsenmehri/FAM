<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" role="img" aria-labelledby="t d" dir="rtl">
<title id="t">Encapsulation در OSI و TCP/IP: سفر یک درخواست HTTP</title>
<desc id="d">نمایش لایهها و تغییر آدرس MAC در هر Hop؛ مقادیر نمونه از RFC 5737 هستند.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/></marker>
<linearGradient id="node" x1="0" x2="1"><stop offset="0" stop-color="#17233c"/><stop offset="1" stop-color="#22345a"/></linearGradient></defs>
<rect x="1" y="1" width="858" height="278" rx="18" fill="#0b1220" stroke="#25334d"/>
<line x1="90" y1="140" x2="300" y2="140" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" opacity="0.85"/>
<text x="195" y="132" fill="#93a4c3" font-size="12" text-anchor="middle" direction="rtl">HTTP / TCP / IP / Ethernet</text>
<line x1="300" y1="140" x2="510" y2="140" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" opacity="0.85"/>
<text x="405" y="132" fill="#93a4c3" font-size="12" text-anchor="middle" direction="rtl">Frame → Gateway MAC</text>
<line x1="510" y1="140" x2="740" y2="140" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" opacity="0.85"/>
<text x="625" y="132" fill="#93a4c3" font-size="12" text-anchor="middle" direction="rtl">New Frame, same IP</text>
<rect x="16" y="106" width="148" height="68" rx="14" fill="url(#node)" stroke="#3b4d72"/>
<text x="90" y="136" fill="#e6edf7" font-size="14" font-weight="700" text-anchor="middle" direction="rtl">Client</text>
<text x="90" y="158" fill="#93a4c3" font-size="11" text-anchor="middle" direction="ltr">192.0.2.10</text>
<rect x="226" y="106" width="148" height="68" rx="14" fill="url(#node)" stroke="#3b4d72"/>
<text x="300" y="136" fill="#e6edf7" font-size="14" font-weight="700" text-anchor="middle" direction="rtl">Access Switch</text>
<text x="300" y="158" fill="#93a4c3" font-size="11" text-anchor="middle" direction="ltr">L2</text>
<rect x="436" y="106" width="148" height="68" rx="14" fill="url(#node)" stroke="#3b4d72"/>
<text x="510" y="136" fill="#e6edf7" font-size="14" font-weight="700" text-anchor="middle" direction="rtl">Router</text>
<text x="510" y="158" fill="#93a4c3" font-size="11" text-anchor="middle" direction="ltr">192.0.2.1</text>
<rect x="666" y="106" width="148" height="68" rx="14" fill="url(#node)" stroke="#3b4d72"/>
<text x="740" y="136" fill="#e6edf7" font-size="14" font-weight="700" text-anchor="middle" direction="rtl">Web Server</text>
<text x="740" y="158" fill="#93a4c3" font-size="11" text-anchor="middle" direction="ltr">203.0.113.10</text>
</svg>
