<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" role="img" aria-labelledby="t d" dir="rtl">
<title id="t">Access VLAN و تفکیک Broadcast Domain</title>
<desc id="d">دو VLAN روی یک سوئیچ؛ ارتباط بین آنها نیازمند Router یا SVI است.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/></marker>
<linearGradient id="node" x1="0" x2="1"><stop offset="0" stop-color="#17233c"/><stop offset="1" stop-color="#22345a"/></linearGradient></defs>
<rect x="1" y="1" width="858" height="278" rx="18" fill="#0b1220" stroke="#25334d"/>
<line x1="120" y1="90" x2="410" y2="150" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" opacity="0.85"/>
<text x="265" y="112" fill="#93a4c3" font-size="12" text-anchor="middle" direction="rtl">untagged</text>
<line x1="120" y1="210" x2="410" y2="150" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" opacity="0.85"/>
<text x="265" y="172" fill="#93a4c3" font-size="12" text-anchor="middle" direction="rtl">untagged</text>
<line x1="410" y1="150" x2="710" y2="150" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" opacity="0.85"/>
<text x="560" y="142" fill="#93a4c3" font-size="12" text-anchor="middle" direction="rtl">trunk or SVI</text>
<rect x="46" y="56" width="148" height="68" rx="14" fill="url(#node)" stroke="#3b4d72"/>
<text x="120" y="86" fill="#e6edf7" font-size="14" font-weight="700" text-anchor="middle" direction="rtl">PC-A</text>
<text x="120" y="108" fill="#93a4c3" font-size="11" text-anchor="middle" direction="ltr">VLAN 10</text>
<rect x="46" y="176" width="148" height="68" rx="14" fill="url(#node)" stroke="#3b4d72"/>
<text x="120" y="206" fill="#e6edf7" font-size="14" font-weight="700" text-anchor="middle" direction="rtl">PC-B</text>
<text x="120" y="228" fill="#93a4c3" font-size="11" text-anchor="middle" direction="ltr">VLAN 20</text>
<rect x="336" y="116" width="148" height="68" rx="14" fill="url(#node)" stroke="#3b4d72"/>
<text x="410" y="146" fill="#e6edf7" font-size="14" font-weight="700" text-anchor="middle" direction="rtl">Access Switch</text>
<text x="410" y="168" fill="#93a4c3" font-size="11" text-anchor="middle" direction="ltr">MAC table per VLAN</text>
<rect x="636" y="116" width="148" height="68" rx="14" fill="url(#node)" stroke="#3b4d72"/>
<text x="710" y="146" fill="#e6edf7" font-size="14" font-weight="700" text-anchor="middle" direction="rtl">Router / SVI</text>
<text x="710" y="168" fill="#93a4c3" font-size="11" text-anchor="middle" direction="ltr">Inter-VLAN</text>
