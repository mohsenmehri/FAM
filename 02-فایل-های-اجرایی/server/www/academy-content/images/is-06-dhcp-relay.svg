<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="450" viewBox="0 0 1020 450" role="img" aria-labelledby="t d"><title id="t">DHCP client and relay on separate interfaces</title><desc id="d">Client LAN and remote DHCP scope are separate subnets. R1 relays DHCP requests and is also a DHCP client on an isolated WAN segment. Proposed design, not executed.</desc><rect width="1020" height="450" fill="#f4f7fb"/><g fill="none" stroke="#145b91" stroke-width="3"><path d="M250 155H390"/><path d="M630 155H770"/><path d="M510 220V300"/></g><g fill="white" stroke="#244e78" stroke-width="3"><rect x="30" y="105" width="220" height="100" rx="10"/><rect x="770" y="105" width="220" height="100" rx="10"/><rect x="390" y="300" width="240" height="90" rx="10"/></g><g fill="#dfe9f4" stroke="#244e78" stroke-width="3"><rect x="390" y="100" width="240" height="120" rx="10"/></g><g font-family="sans-serif" fill="#102b46" text-anchor="middle"><text x="510" y="36" font-size="22">DHCP client and relay — isolated lab</text><text x="140" y="140" font-size="19">PC-A / DHCP client</text><text x="140" y="166" font-size="14">LAN 10.10.0.0/24</text><text x="140" y="188" font-size="12">Lease from remote scope</text><text x="510" y="128" font-size="20">R1</text><text x="510" y="153" font-size="12">Gi0/0 10.10.0.1 · helper</text><text x="510" y="174" font-size="12">Gi0/2 10.20.0.1</text><text x="510" y="195" font-size="12">Gi0/1 DHCP client</text><text x="880" y="137" font-size="18">DHCP-REMOTE</text><text x="880" y="164" font-size="14">10.20.0.200/24</text><text x="880" y="186" font-size="12">Scope: 10.10.0.0/24</text><text x="510" y="332" font-size="18">DHCP-ISP (simulated)</text><text x="510" y="356" font-size="14">198.51.100.1 → R1 Gi0/1</text><text x="510" y="378" font-size="12">Isolated pool; no real ISP</text><text x="510" y="430" font-size="15">Proposed design — not executed</text></g></svg>