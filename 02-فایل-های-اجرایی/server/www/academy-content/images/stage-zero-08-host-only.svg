<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-labelledby="title desc">
<title id="title">VirtualBox host-only lab topology</title><desc id="desc">Windows host and Ubuntu virtual machine are connected to a host-only network. The DHCP service at 192.168.56.2 offers the .100–.150 range to the Ubuntu DHCP client; all addresses are proposed.</desc>
<rect width="900" height="280" fill="#f4f7fb"/><g fill="#fff" stroke="#244e78" stroke-width="3"><rect x="30" y="62" width="235" height="135" rx="12"/><rect x="335" y="62" width="230" height="135" rx="12"/><rect x="635" y="62" width="235" height="135" rx="12"/></g><g stroke="#244e78" stroke-width="4"><path d="M265 130h70M565 130h70"/></g><g text-anchor="middle" font-family="sans-serif" fill="#102b46"><text x="147" y="96" font-size="20">Windows 11 Host</text><text x="147" y="125" font-size="16">192.168.56.1/24</text><text x="147" y="151" font-size="15">VirtualBox 7.2.0</text><text x="450" y="98" font-size="20">Host-only network</text><text x="450" y="125" font-size="15">DHCP 192.168.56.2</text><text x="450" y="151" font-size="15">Range .100 – .150</text><text x="752" y="96" font-size="20">Ubuntu Server VM</text><text x="752" y="125" font-size="16">DHCP client</text><text x="752" y="151" font-size="15">Lease: .100–.150/24</text><text x="752" y="176" font-size="15">One adapter</text><text x="450" y="238" font-size="16">Proposed design — not executed or validated</text></g></svg>
