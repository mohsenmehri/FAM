<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="title desc"><title id="title">Successful TCP handshake conceptual example</title><desc id="desc">SYN from client to server, SYN-ACK from server to client, ACK from client to server. This is a proposed educational illustration, not a packet capture.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#145b91"/></marker></defs><rect width="900" height="340" fill="#f5f8fc"/><g font-family="sans-serif" fill="#152e4b" text-anchor="middle"><text x="450" y="30" font-size="21">TCP handshake — successful example</text><text x="150" y="70" font-size="19">Client</text><text x="750" y="70" font-size="19">Server</text><text x="450" y="111" font-size="17">1. SYN</text><text x="450" y="171" font-size="17">2. SYN-ACK</text><text x="450" y="231" font-size="17">3. ACK</text><text x="450" y="310" font-size="15">Illustrative only — not a packet capture</text></g><g stroke="#145b91" stroke-width="3" fill="none"><path d="M150 80V270M750 80V270" stroke-dasharray="7 5"/><path d="M155 120H740" marker-end="url(#arrow)"/><path d="M745 180H160" marker-end="url(#arrow)"/><path d="M155 240H740" marker-end="url(#arrow)"/></g></svg>
