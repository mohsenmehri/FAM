<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="460" viewBox="0 0 1080 460" role="img" aria-labelledby="t d"><title id="t">VLANs across two switches with a tagged 802.1Q trunk</title><desc id="d">PC-A connects to SW1 Gi0/1 in VLAN 10. SW1 Gi0/3 is left unconfigured and unused to check default VLAN 1 membership. SW1 Gi0/24 connects to SW2 Gi0/24 through an 802.1Q trunk with allowed VLANs 10, 20, and 999; VLAN 999 is native. SW2 Gi0/1 connects to PC-B in VLAN 10 and Gi0/2 connects to PC-C in VLAN 20. PC-A and PC-B share a subnet and VLAN; PC-A and PC-C have no layer 3 path. Proposed design, not executed.</desc><rect width="1080" height="460" fill="#f4f7fb"/><g fill="white" stroke="#244e78" stroke-width="3"><rect x="35" y="165" width="185" height="85" rx="10"/><rect x="320" y="145" width="210" height="125" rx="10"/><rect x="610" y="145" width="230" height="125" rx="10"/><rect x="895" y="70" width="170" height="80" rx="10"/><rect x="895" y="290" width="170" height="80" rx="10"/></g><g fill="none" stroke="#145b91" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M220 207H320M530 207H610M840 178H868V110H895M840 238H868V330H895"/></g><g font-family="sans-serif" fill="#102b46" text-anchor="middle"><text x="540" y="34" font-size="22">Two data VLANs across two switches — proposed lab</text><text x="127" y="198" font-size="18">PC-A · VLAN 10</text><text x="127" y="225" font-size="14">192.0.2.10/24</text><text x="425" y="177" font-size="20">SW1</text><text x="425" y="207" font-size="13">Gi0/1 access · VLAN 10</text><text x="425" y="235" font-size="13">Gi0/24 · 802.1Q trunk</text><text x="425" y="255" font-size="12">Gi0/3 · default VLAN 1 (unused)</text><text x="725" y="177" font-size="20">SW2</text><text x="725" y="202" font-size="12">Gi0/1 access · VLAN 10</text><text x="725" y="222" font-size="12">Gi0/2 access · VLAN 20</text><text x="725" y="245" font-size="12">Gi0/24 · 802.1Q trunk</text><text x="980" y="102" font-size="17">PC-B · VLAN 10</text><text x="980" y="126" font-size="14">192.0.2.11/24</text><text x="980" y="322" font-size="17">PC-C · VLAN 20</text><text x="980" y="346" font-size="14">198.51.100.10/24</text><text x="570" y="105" font-size="14">Allowed 10,20,999 · native 999</text><text x="540" y="406" font-size="15">A↔B: same VLAN, tagged across trunk · A↔C: no Layer 3 path</text><text x="540" y="444" font-size="14">Proposed PNETLab design — not executed</text></g></svg>
