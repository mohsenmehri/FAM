<title id="t">HSRP tracked-link failover worksheet</title>
<desc id="d">Proposed and unexecuted isolated PNETLab design. PC-A uses 10.10.0.254 as its HSRP default gateway through SW-LAN. R1 Gi0/0 is 10.10.0.1 with priority 110 and expected Active; R2 Gi0/0 is 10.10.0.2 with priority 100 and Standby. R1 and R2 have a separate 192.0.2.0 slash 30 lab link. R2 Loopback 203.0.113.10 slash 32 is the local test destination, not an Internet or WAN service.</desc>
