<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Control, management and data planes in traditional and controller-based networks</title>
  <desc id="desc">Logical, unexecuted teaching diagram. A controller sends policy or state through a management/control channel to a network device. The device has local control functions and a routing information base feeding a forwarding information base and data plane. User packets pass through the data plane, not necessarily through the controller. Continuing traffic during controller loss depends on installed state, timeouts and fail mode.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#145b91"/></marker>
    <marker id="dashArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8a5a00"/></marker>
  </defs>
  <rect width="1100" height="520" fill="#f4f7fb"/>
  <text x="550" y="36" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="bold" fill="#102b46">Control / Management / Data — logical roles</text>
  <rect x="390" y="66" width="320" height="76" rx="12" fill="#fff4d9" stroke="#8a5a00" stroke-width="3"/>
  <text x="550" y="98" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#102b46">Controller / Management API</text>
  <text x="550" y="123" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#102b46">aggregates policy/state (architecture-dependent)</text>
  <rect x="95" y="175" width="910" height="235" rx="16" fill="#ffffff" stroke="#244e78" stroke-width="3"/>
  <text x="550" y="204" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#102b46">Network device — local functions may remain in controller-based designs</text>
  <rect x="135" y="230" width="270" height="126" rx="12" fill="#e8f1fa" stroke="#244e78" stroke-width="2"/>
  <text x="270" y="260" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#102b46">Control Plane</text>
  <text x="270" y="285" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#102b46">OSPF / STP / local decisions</text>
  <text x="270" y="308" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#102b46">RIB / neighbor state</text>
  <text x="270" y="335" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#102b46">CPU or implementation-specific process</text>
  <rect x="430" y="230" width="240" height="126" rx="12" fill="#e8f1fa" stroke="#244e78" stroke-width="2"/>
  <text x="550" y="260" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#102b46">Programmed state</text>
  <text x="550" y="289" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#102b46">RIB → FIB / ACL / QoS</text>
  <text x="550" y="317" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#102b46">installation and verification vary</text>
  <rect x="695" y="230" width="270" height="126" rx="12" fill="#dff1e7" stroke="#287345" stroke-width="2"/>
  <text x="830" y="260" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#102b46">Data Plane</text>
  <text x="830" y="289" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#102b46">lookup / apply policy / forward</text>
  <text x="830" y="317" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#102b46">ASIC, NPU or software engine</text>
  <path d="M405 293 H427" fill="none" stroke="#145b91" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M670 293 H692" fill="none" stroke="#145b91" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M550 143 V166 H550 V225" fill="none" stroke="#8a5a00" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#dashArrow)"/>
  <text x="735" y="163" font-family="sans-serif" font-size="13" fill="#704900">policy / management or control channel</text>
  <rect x="135" y="438" width="300" height="48" rx="10" fill="#ffffff" stroke="#145b91" stroke-width="2"/>
  <rect x="665" y="438" width="300" height="48" rx="10" fill="#ffffff" stroke="#145b91" stroke-width="2"/>
  <text x="285" y="468" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#102b46">User traffic source</text>
  <text x="815" y="468" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#102b46">User traffic destination</text>
  <path d="M435 462 H490 V414 H830 V359" fill="none" stroke="#145b91" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M830 356 V410 H815 V435" fill="none" stroke="#145b91" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="550" y="505" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#102b46">Controller loss: forwarding continuity depends on installed state, timers and device fail mode</text>
</svg>
