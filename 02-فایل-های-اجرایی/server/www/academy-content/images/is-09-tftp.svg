<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="t d"><title id="t">TFTP and FTP file transfer</title><desc id="d">TFTP requests start on UDP 69 then use dynamically selected transfer identifiers (TIDs); FTP uses TCP 21 for control and a mode-dependent data channel. Proposed design, not executed.</desc><rect width="960" height="350" fill="#f4f7fb"/><g fill="none" stroke="#145b91" stroke-width="3"><path d="M300 165H365"/><path d="M595 165H660"/></g><g fill="white" stroke="#244e78" stroke-width="3"><rect x="70" y="115" width="230" height="100" rx="10"/><rect x="660" y="115" width="230" height="100" rx="10"/></g><g fill="#dfe9f4" stroke="#244e78" stroke-width="3"><rect x="365" y="115" width="230" height="100" rx="10"/></g><g font-family="sans-serif" fill="#102b46" text-anchor="middle"><text x="480" y="36" font-size="22">TFTP and FTP file transfer</text><text x="185" y="152" font-size="19">R1</text><text x="185" y="178" font-size="14">running-config</text><text x="480" y="152" font-size="19">Transfer</text><text x="480" y="178" font-size="14">TFTP / FTP</text><text x="775" y="152" font-size="19">Server</text><text x="775" y="178" font-size="14">192.0.2.200</text><text x="480" y="268" font-size="15">TFTP: UDP 69 request + dynamic TID · FTP: control TCP 21, data varies</text><text x="480" y="332" font-size="15">Proposed design — not executed</text></g></svg>