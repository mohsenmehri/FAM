<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FAM Academy — گالری ۲۰ سبک لوکس توپولوژی زنده و داشبورد دانشجو</title>
  <style>
    :root {
      --studio-bg: #05070d;
      --studio-panel: #0d1424;
      --studio-border: rgba(148,163,184,.18);
      --studio-text: #e9f0fb;
      --studio-muted: #8b98af;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      font-family:"Vazirmatn","IRANSans","Segoe UI",Tahoma,system-ui,sans-serif;
      background:var(--studio-bg);color:var(--studio-text);
      line-height:1.85;overflow-x:hidden;-webkit-font-smoothing:antialiased;
    }
    button,input,select{font-family:inherit}
    a{color:inherit;text-decoration:none}
    ul{list-style:none}

    /* ===== نوار استودیو ===== */
    .studio-bar{
      position:sticky;top:0;z-index:120;
      background:rgba(5,7,13,.92);backdrop-filter:blur(16px);
      border-bottom:1px solid var(--studio-border);
      padding:10px 18px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;
    }
    .studio-bar.hidden{display:none}
    .studio-brand{display:flex;align-items:center;gap:10px}
    .studio-badge{
      width:36px;height:36px;border-radius:11px;display:grid;place-items:center;
      background:linear-gradient(135deg,#00d4ff,#3b82f6);color:#04121c;font-weight:900;font-size:.95rem;
      box-shadow:0 6px 20px #00d4ff33;
    }
    .studio-brand strong{display:block;font-size:.94rem}
    .studio-brand small{display:block;font-size:.73rem;color:var(--studio-muted)}
    .studio-controls{display:flex;flex-wrap:wrap;align-items:center;gap:7px}
    .st-btn,.st-select{
      border:1px solid rgba(148,163,184,.24);background:#111a2e;color:#e9f0fb;
      border-radius:10px;padding:7px 12px;font-size:.8rem;font-weight:700;cursor:pointer;transition:.16s;
    }
    .st-btn:hover{border-color:#00d4ff;transform:translateY(-1px)}
    .st-btn.active{background:linear-gradient(120deg,#00d4ff,#3b82f6);color:#04121c;border-color:transparent}
    .st-btn.gold{background:linear-gradient(120deg,#fbbf24,#f59e0b);color:#170f02;border-color:transparent}

    .studio-pills{
      background:#080c16;border-bottom:1px solid var(--studio-border);
      padding:8px 18px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;
    }
    .studio-pills.hidden{display:none}
    .st-chip{
      flex:0 0 auto;border:1px solid rgba(148,163,184,.2);background:#0f172a;color:#cbd5e1;
      border-radius:99px;padding:5px 12px;font-size:.75rem;font-weight:700;cursor:pointer;
      display:inline-flex;align-items:center;gap:6px;transition:.15s;
    }
    .st-chip.active{border-color:#00d4ff;background:#00d4ff1c;color:#fff}
    .st-dot{width:10px;height:10px;border-radius:50%;border:1px solid rgba(255,255,255,.35)}

    /* ===== گالری ۲۰ مدل ===== */
    .gal-wrap{max-width:1360px;margin:0 auto;padding:28px 20px 64px}
    .gal-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:14px;margin-bottom:24px}
    .gal-head h1{font-size:clamp(1.35rem,2.5vw,1.95rem);font-weight:900}
    .gal-head p{color:var(--studio-muted);font-size:.9rem;margin-top:4px}
    .gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
    .gal-card{
      background:#0d1424;border:1px solid rgba(148,163,184,.18);border-radius:20px;overflow:hidden;
      display:flex;flex-direction:column;justify-content:space-between;transition:.2s ease;
    }
    .gal-card:hover{transform:translateY(-4px);border-color:#00d4ff88;box-shadow:0 24px 55px rgba(0,0,0,.55)}
    .gal-thumb{
      padding:16px;min-height:165px;position:relative;overflow:hidden;
      border-bottom:1px solid rgba(148,163,184,.16);display:flex;flex-direction:column;justify-content:space-between;
    }
    .gal-thumb-top{display:flex;align-items:center;justify-content:space-between;font-size:.72rem;font-weight:800;z-index:1}
    .gal-thumb-title{font-size:1.05rem;font-weight:900;line-height:1.5;z-index:1;margin:8px 0}
    .gal-thumb-mini{display:grid;grid-template-columns:1.2fr .8fr;gap:8px;z-index:1}
    .gal-mini-box{height:38px;border-radius:10px;padding:6px 9px;font-size:.7rem;font-weight:700;display:flex;align-items:center;justify-content:space-between}
    .gal-body{padding:16px;display:grid;gap:8px}
    .gal-body h3{font-size:.98rem;font-weight:800}
    .gal-body p{font-size:.82rem;color:#94a3b8;line-height:1.75}
    .gal-swatches{display:flex;align-items:center;gap:6px;margin-top:2px}
    .gal-swatches span{width:18px;height:18px;border-radius:50%;border:1px solid rgba(255,255,255,.28)}
    .gal-foot{padding:0 16px 16px;display:flex;gap:8px}
    .gal-foot button{flex:1}

    /* ===== محیط زندهٔ پیش‌نمایش (الهام مستقیم از نسخهٔ شیک) ===== */
    .stage-root{
      position:relative;min-height:100vh;
      background:var(--bg);color:var(--text);
      overflow-x:hidden;
    }
    .bg-fx{
      position:fixed;inset:0;z-index:0;pointer-events:none;
      background:
        linear-gradient(var(--grid) 1px,transparent 1px) 0 0/46px 46px,
        linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/46px 46px,
        radial-gradient(1000px 600px at 85% -10%,var(--glow1),transparent 60%),
        radial-gradient(900px 700px at -10% 30%,var(--glow2),transparent 60%),
        var(--bg);
    }
    .glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55}
    .g1{width:420px;height:420px;background:var(--glow1);top:-110px;right:-80px}
    .g2{width:380px;height:380px;background:var(--glow2);top:38%;left:-140px}
    .g3{width:300px;height:300px;background:var(--glow3);bottom:-80px;right:28%}
    .stage-content{position:relative;z-index:1}
    .container{width:min(1200px,92vw);margin-inline:auto}

    /* دکمه‌ها و بج‌ها */
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      padding:10px 20px;border-radius:14px;font-size:14px;font-weight:700;
      border:1px solid transparent;cursor:pointer;transition:.18s ease;white-space:nowrap;
    }
    .btn-primary{
      background:var(--grad);color:var(--on-accent);
      box-shadow:0 10px 26px color-mix(in srgb,var(--accent) 26%,transparent), inset 0 1px 0 rgba(255,255,255,.4);
    }
    .btn-primary:hover{transform:translateY(-2px);filter:brightness(1.06)}
    .btn-ghost{background:var(--glass);border-color:var(--line);color:var(--text);backdrop-filter:blur(8px)}
    .btn-ghost:hover{border-color:var(--accent);transform:translateY(-2px)}
    .btn-lg{padding:13px 26px;font-size:15px;border-radius:16px}

    /* ناوبری بالای صفحهٔ عمومی */
    .nav{
      position:sticky;top:0;z-index:60;
      background:var(--nav-bg);backdrop-filter:blur(16px);
      border-bottom:1px solid var(--line2);
    }
    .nav-inner{display:flex;align-items:center;gap:22px;height:70px;flex-wrap:wrap}
    .logo{display:flex;align-items:center;gap:10px;cursor:pointer}
    .logo-t{font-size:17px;font-weight:900;letter-spacing:-.3px}
    .logo-t b{font-weight:500;color:var(--accent);margin-inline-start:4px}
    .nav-links{display:flex;gap:6px;margin-inline-start:12px}
    .nav-links button{
      background:none;border:0;color:var(--muted);padding:8px 14px;border-radius:11px;
      font-size:14px;font-weight:700;cursor:pointer;transition:.16s;position:relative;
    }
    .nav-links button:hover{color:var(--text);background:var(--glass)}
    .nav-links button.active{color:var(--text);background:color-mix(in srgb,var(--accent) 14%,transparent)}
    .nav-links button.active::after{
      content:"";position:absolute;bottom:-1px;right:14px;left:14px;height:2.5px;background:var(--grad);border-radius:99px;
    }
    .nav-cta{display:flex;gap:10px;margin-inline-start:auto}

    /* هیرو صفحهٔ عمومی */
    .hero{
      display:grid;grid-template-columns:1.02fr 1fr;gap:40px;align-items:center;
      padding-top:clamp(34px,6vh,72px);padding-bottom:clamp(36px,6vh,70px);
    }
    .kicker{
      display:inline-flex;align-items:center;gap:8px;
      font-size:12.5px;font-weight:800;color:var(--accent);
      background:color-mix(in srgb,var(--accent) 12%,transparent);
      border:1px solid color-mix(in srgb,var(--accent) 32%,transparent);
      padding:6px 14px;border-radius:99px;
    }
    .kicker .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:pulse 1.8s infinite}
    @keyframes pulse{50%{opacity:.35;transform:scale(.75)}}
    .hero h1{
      font-size:clamp(28px,4.4vw,50px);line-height:1.45;font-weight:900;letter-spacing:-.8px;margin:18px 0 14px;
    }
    .hero h1 em{
      font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
    }
    .lede{font-size:15.5px;color:var(--muted);max-width:56ch;line-height:1.95}
    .lede b{color:var(--text)}
    .hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
    .hero-trust{display:flex;gap:32px;margin-top:30px;padding-top:22px;border-top:1px dashed var(--line)}
    .hero-trust li{display:flex;flex-direction:column}
    .hero-trust b{font-size:23px;font-weight:900;color:var(--text)}
    .hero-trust span{font-size:12.5px;color:var(--muted)}

    /* نقشهٔ زنده + چیپ‌های معلق + ترمینال کج */
    .hero-visual{position:relative;min-height:470px}
    .topo-frame{
      border-radius:22px;padding:10px;
      background:var(--topo-bg, transparent);
    }
    .topo{width:100%;height:auto;filter:drop-shadow(0 24px 48px rgba(0,0,0,.38))}
    .topo .t-label{font-family:"JetBrains Mono",Consolas,monospace;font-size:11px;font-weight:700;letter-spacing:.06em}
    .topo .ln{stroke-dasharray:7 9;opacity:.9;animation:flow 1.1s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-16}}

    .chip-float{
      position:absolute;display:inline-flex;align-items:center;gap:7px;
      font-family:"JetBrains Mono",Consolas,monospace;font-size:11.5px;font-weight:700;
      background:var(--panel);border:1px solid var(--line);color:var(--text);
      padding:7px 13px;border-radius:11px;box-shadow:0 16px 34px rgba(0,0,0,.35);backdrop-filter:blur(8px);
      animation:bob 5s ease-in-out infinite;z-index:3;
    }
    .chip-float i{font-style:normal;color:var(--accent3)}
    .cf1{top:5%;right:-2%}
    .cf2{top:46%;left:-3%;animation-delay:1.4s}
    .cf3{bottom:21%;right:3%;animation-delay:2.6s;border-color:var(--accent)}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}

    .term{
      background:var(--term-bg);border:1px solid rgba(148,163,184,.24);border-radius:16px;overflow:hidden;
      box-shadow:0 28px 65px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08);
    }
    .hero-visual .term{
      position:absolute;bottom:-12px;left:-6px;width:min(410px,88%);transform:rotate(-1.3deg);z-index:4;
    }
    .term-bar{display:flex;align-items:center;gap:7px;padding:10px 14px;background:rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.08)}
    .term-bar i{width:10px;height:10px;border-radius:50%}
    .term-bar i:nth-child(1){background:#fb7185}.term-bar i:nth-child(2){background:#fbbf24}.term-bar i:nth-child(3){background:#34d399}
    .term-bar span{margin-inline-start:auto;font-family:"JetBrains Mono",Consolas,monospace;font-size:11px;color:#94a3b8}
    .term-body{
      padding:14px 16px;font-family:"JetBrains Mono",Consolas,monospace;font-size:12px;line-height:1.95;
      direction:ltr;text-align:left;color:var(--term-text);min-height:132px;white-space:pre-wrap;
    }
    .caret{display:inline-block;width:7px;height:13px;background:var(--accent);vertical-align:-2px;animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}

    /* نوار آمار */
    .statbar{border-block:1px solid var(--line2);background:var(--glass2);backdrop-filter:blur(6px)}
    .statbar-in{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:22px 0}
    .stat{text-align:center;padding:8px;border-radius:14px}
    .stat b{
      display:block;font-size:clamp(22px,3vw,32px);font-weight:900;
      background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
    }
    .stat span{font-size:13px;color:var(--muted)}

    /* بخش دوره‌ها + ۷ دانشکده */
    .section{padding-block:54px}
    .sec-head{max-width:680px;margin-bottom:28px}
    .sec-head h2{font-size:clamp(22px,3vw,34px);font-weight:900;margin:12px 0 8px;line-height:1.45}
    .sec-head p{color:var(--muted);font-size:14.5px}

    .course-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:18px}
    .course{
      position:relative;background:linear-gradient(165deg,var(--glass),var(--glass2));
      border:1px solid var(--line);border-radius:var(--radius);padding:22px;
      display:flex;flex-direction:column;gap:12px;overflow:hidden;transition:.22s ease;
    }
    .course::before{content:"";position:absolute;inset-inline:0;top:0;height:3px;background:var(--c,var(--grad))}
    .course:hover{transform:translateY(-6px);border-color:var(--accent);box-shadow:0 22px 48px rgba(0,0,0,.22)}
    .course-top{display:flex;align-items:center;justify-content:space-between}
    .badge{
      font-size:11px;font-weight:800;padding:4px 11px;border-radius:99px;
      background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);
      border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);
    }
    .lvl{font-size:11.5px;color:var(--muted);font-weight:700}
    .course h3{font-size:19px;font-weight:900}
    .course p{font-size:13.5px;color:var(--muted);line-height:1.9;flex:1}
    .meta{display:flex;gap:7px;flex-wrap:wrap}
    .meta li{font-size:11px;font-weight:700;color:var(--text);background:var(--glass);border:1px solid var(--line2);padding:3px 10px;border-radius:99px}
    .course-foot{display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px dashed var(--line)}
    .price{font-size:13px;font-weight:800;color:var(--accent)}

    /* مسیر ۷ ایستگاهی درخشان */
    .path-sec{background:var(--glass2);border-block:1px solid var(--line2)}
    .path{position:relative;display:flex;gap:10px;overflow-x:auto;padding:30px 4px 12px;scrollbar-width:thin}
    .path-line{
      position:absolute;top:48px;right:20px;left:20px;height:3px;border-radius:99px;
      background:linear-gradient(90deg,var(--accent) 0 46%,var(--line) 46% 100%);
    }
    .station{
      position:relative;flex:0 0 142px;text-align:center;z-index:1;
      background:var(--panel);border:1px solid transparent;padding:8px 8px 10px;border-radius:16px;cursor:pointer;transition:.18s;
    }
    .station:hover{border-color:var(--line)}
    .st-dot{
      width:38px;height:38px;margin:0 auto 10px;border-radius:50%;
      display:grid;place-items:center;font-weight:900;font-size:13px;
      background:var(--panel2);border:2.5px solid var(--line);color:var(--muted);
    }
    .station b{display:block;font-size:13px;font-weight:800}
    .station small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
    .station.done .st-dot{background:color-mix(in srgb,var(--accent) 16%,transparent);border-color:var(--accent);color:var(--accent)}
    .station.now{background:color-mix(in srgb,var(--accent) 10%,var(--panel));border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
    .station.now .st-dot{background:var(--grad);border-color:transparent;color:var(--on-accent);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 20%,transparent)}
    .station.goal .st-dot{background:color-mix(in srgb,var(--warn) 18%,transparent);border-color:var(--warn);color:var(--warn)}

    /* ================= داشبورد دانشجو (نسخهٔ شیک) ================= */
    .dash-wrap{display:flex;min-height:calc(100vh - 56px);background:var(--bg2)}
    .side{
      width:252px;flex:0 0 252px;position:sticky;top:0;height:100vh;
      background:var(--panel);border-inline-end:1px solid var(--line2);
      display:flex;flex-direction:column;padding:18px 14px;gap:6px;z-index:50;
    }
    .side-sep{font-size:10.5px;font-weight:800;letter-spacing:.12em;color:var(--muted);padding:12px 10px 4px}
    .snav{
      display:flex;align-items:center;gap:10px;width:100%;padding:11px 13px;border-radius:13px;
      border:1px solid transparent;background:transparent;color:var(--muted);
      font-size:13.5px;font-weight:700;cursor:pointer;transition:.16s;text-align:start;position:relative;
    }
    .snav:hover{background:var(--glass);color:var(--text)}
    .snav.active{
      background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--text);
      border-color:color-mix(in srgb,var(--accent) 36%,transparent);
    }
    .snav .pill{
      margin-inline-start:auto;font-size:10.5px;font-weight:900;background:var(--grad);
      color:var(--on-accent);border-radius:99px;padding:1px 8px;
    }
    .upgrade{
      margin-top:auto;border-radius:16px;padding:14px;
      background:color-mix(in srgb,var(--accent) 11%,var(--panel2));
      border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);display:grid;gap:8px;
    }
    .upgrade small{font-size:12px;color:var(--muted);line-height:1.6}

    .dash-main{flex:1;min-width:0;display:flex;flex-direction:column}
    .topbar{
      position:sticky;top:0;z-index:40;background:var(--nav-bg);backdrop-filter:blur(14px);
      border-bottom:1px solid var(--line2);padding:12px 24px;
      display:flex;flex-wrap:wrap;align-items:center;gap:14px;
    }
    .topbar h1{font-size:18px;font-weight:900;line-height:1.3}
    .crumb{font-size:12px;color:var(--muted)}
    .search-pill{
      margin-inline-start:auto;display:flex;align-items:center;gap:8px;
      background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:7px 12px;min-width:250px;
    }
    .search-pill input{border:0;background:transparent;color:var(--text);outline:0;width:100%;font-size:13px}
    .streak{
      display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;
      background:color-mix(in srgb,var(--warn) 14%,transparent);border:1px solid color-mix(in srgb,var(--warn) 36%,transparent);
      color:var(--text);padding:6px 12px;border-radius:99px;
    }
    .avatar{
      width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
      background:var(--grad);color:var(--on-accent);font-weight:900;font-size:14px;
    }
    .dash-body{padding:22px 24px 48px;display:grid;gap:18px}

    /* کارت ادامهٔ یادگیری + حلقه پیشرفت */
    .continue{
      background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 12%,var(--panel)),var(--panel));
      border:1px solid color-mix(in srgb,var(--accent) 34%,transparent);
      border-radius:22px;padding:24px;display:grid;grid-template-columns:1fr auto;gap:22px;align-items:center;
    }
    .continue h2{font-size:22px;font-weight:900;margin:10px 0 6px}
    .continue .sub{font-size:13.5px;color:var(--muted)}
    .prog-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:16px}
    .bar{height:9px;width:210px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);overflow:hidden}
    .bar i{display:block;height:100%;background:var(--grad);border-radius:99px}
    .cont-side{display:flex;flex-direction:column;align-items:center;gap:8px}
    .ring{position:relative;width:116px;height:116px}
    .ring svg{width:116px;height:116px;transform:rotate(-90deg)}
    .ring circle{fill:none;stroke-width:9;stroke-linecap:round}
    .ring .tr{stroke:var(--line)}
    .ring .fg{stroke:var(--accent);stroke-dasharray:339.29;transition:stroke-dashoffset .4s ease}
    .ring .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
    .ring .mid b{display:block;font-size:20px;font-weight:900;line-height:1.1}
    .ring .mid small{font-size:10.5px;color:var(--muted)}
    .xp-pill{font-size:12px;font-weight:800;color:var(--accent);background:var(--panel2);border:1px solid var(--line);padding:4px 12px;border-radius:99px}

    .grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
    .grid-2{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}
    .card{
      background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;
    }
    .card h3{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
    .missions{display:grid;gap:9px;margin-top:14px}
    .mission{
      display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:13px;
      background:var(--panel2);border:1px solid var(--line2);cursor:pointer;transition:.15s;
    }
    .mission:hover{border-color:var(--accent)}
    .mcheck{
      width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:900;
      border:1.5px solid var(--line);color:transparent;flex:0 0 22px;
    }
    .mission.done .mcheck{background:var(--accent3);border-color:var(--accent3);color:#03150e}
    .mission.done b{text-decoration:line-through;opacity:.75}
    .mt{flex:1;min-width:0}
    .mt b{display:block;font-size:13px}
    .mt small{display:block;font-size:11.5px;color:var(--muted)}
    .xp{font-size:12px;font-weight:900;color:var(--accent)}

    .live-card{
      background:linear-gradient(155deg,color-mix(in srgb,var(--accent2) 15%,var(--panel)),var(--panel));
      border:1px solid color-mix(in srgb,var(--accent2) 38%,transparent);
      border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;
    }
    .when{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;color:var(--accent2)}
    .rec{width:8px;height:8px;border-radius:50%;background:#f43f5e;box-shadow:0 0 10px #f43f5e;animation:pulse 1.3s infinite}
    .feed{display:grid;gap:10px;margin-top:14px}
    .fitem{
      display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:13px;
      background:var(--panel2);border:1px solid var(--line2);
    }
    .fic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--glass);font-size:15px}
    .fitem b{display:block;font-size:13px}
    .fitem small{display:block;font-size:11.5px;color:var(--muted)}
    .ftime{margin-inline-start:auto;font-size:11px;color:var(--muted)}

    /* کارت‌های اختصاصی بر اساس سبک کارت */
    .card-brutal-edge .card,.card-brutal-edge .course,.card-brutal-edge .continue,.card-brutal-edge .live-card,.card-brutal-edge .btn{
      border:2px solid #111827!important;box-shadow:4px 4px 0 #111827!important;
    }
    .card-cad-blueprint .card,.card-cad-blueprint .course,.card-cad-blueprint .continue{
      border-style:dashed;
    }
    .card-rack-metal .course,.card-rack-metal .card{
      border-inline-start:4px solid var(--accent);
    }
    .card-lapis-gold .continue,.card-lapis-gold .course{
      border-top:2px solid var(--accent2);
    }
    .card-crisp-apple .course,.card-crisp-apple .card,.card-crisp-apple .continue,.card-crisp-apple .live-card{
      box-shadow:0 12px 32px rgba(15,23,42,.06);
    }

    @media (max-width:980px){
      .hero,.grid-3,.grid-2,.continue{grid-template-columns:1fr}
      .statbar-in{grid-template-columns:repeat(2,1fr)}
      .dash-wrap{flex-direction:column}
      .side{width:100%;height:auto;position:static}
      .hero-visual .term{position:static;width:100%;transform:none;margin-top:12px}
      .cf1,.cf2,.cf3{display:none}
    }
  </style>

                        <button class="btn btn-primary" data-dash-tab="lab">ادامهٔ درس و آزمایشگاه ←</button>
                        <button class="btn btn-ghost" data-dash-tab="courses">۷ دانشکده</button>
                      </div>
                    </div>
                    <div class="cont-side">
                      <div class="ring">
                        <svg viewBox="0 0 120 120">
                          <circle class="tr" cx="60" cy="60" r="54"/>
                          <circle class="fg" cx="60" cy="60" r="54" style="stroke-dashoffset:${dashOffset}"/>
                        </svg>
                        <div class="mid"><div><b>${pctRing}٪</b><small>مسیر CCNA</small></div></div>
                      </div>
                      <span class="xp-pill">سطح ۸ · ${xp.toLocaleString('fa-IR')} XP</span>
                    </div>
                  </div>

                  <div class="grid-3">
                    <div class="card">
                      <h3>🎯 مأموریت امروز (${doneCount}/۳)</h3>
                      <div class="missions">
                        ${[
                          ['یک درس کامل کن', 'VLAN و Trunk — تکمیل درس', '+۲۰ XP'],
                          ['یک آزمایشگاه اجرا کن', 'سناریوی ۱۲: trunk با دو VLAN', '+۲۰ XP'],
                          ['۵ کارت مرور بزن', '۲ دقیقه · ماسک زیرشبکه', '+۲۰ XP']
                        ].map(([t, sub, pts], i) => `
                          <div class="mission ${state.missionsDone[i]?'done':''}" data-toggle-mission="${i}">
                            <span class="mcheck">✓</span>
                            <span class="mt"><b>${t}</b><small>${sub}</small></span>
                            <span class="xp">${pts}</span>
                          </div>`).join('')}
                      </div>
                    </div>

                    <div class="live-card">
                      <div>
                        <span class="when"><span class="rec"></span> آزمایشگاه زنده · آمادهٔ اجرا</span>
                        <h3 style="margin:10px 0 8px">شبیه‌ساز ARP / VLAN / OSPF</h3>
                        <p style="font-size:13.5px;color:var(--muted);line-height:1.85">دستورهای واقعی Cisco IOS را در محیط امن بزن و وضعیت همسایگی DR/BDR را بلافاصله ببین.</p>
                      </div>
                      <button class="btn btn-primary" data-dash-tab="lab">باز کردن ترمینال IOS ←</button>
                    </div>

                    <div class="card" style="display:flex;flex-direction:column;justify-content:space-between">
                      <div>
                        <h3>🧭 قدم بعدی پیشنهادی</h3>
                        <p style="font-size:13.5px;color:var(--muted);margin-top:10px;line-height:1.9">
                          بر اساس پیشرفت فعلی شما در <b style="color:var(--text)">دانشکده ۱</b>، بهتر است بعد از Trunking وارد سناریوی <b style="color:var(--text)">OSPF Multi-Area</b> شوید.
                        </p>
                      </div>
                      <button class="btn btn-ghost" data-dash-tab="courses" style="margin-top:12px">مشاهدهٔ کل نقشه ←</button>
                    </div>
                  </div>

                  <div class="grid-2">
                    <div class="card">
                      <h3>⏱ فعالیت اخیر</h3>
                      <div class="feed">
                        <div class="fitem"><span class="fic">📘</span><span><b>درس ۱۲ · VLAN و Trunk تمام شد</b><small>CCNA — فصل ۴</small></span><span class="ftime">۲ ساعت پیش</span></div>
                        <div class="fitem"><span class="fic">🧪</span><span><b>آزمایشگاه «VLAN base» — نمره ۹۰</b><small>سناریوی ۱۰</small></span><span class="ftime">دیروز</span></div>
                        <div class="fitem"><span class="fic">🏆</span><span><b>آزمون نگهبان فصل ۳ — قبولی ✓</b><small>۸ از ۱۰</small></span><span class="ftime">دیروز</span></div>
                      </div>
                    </div>

                    <div class="card">
                      <h3>🗺 جایگاه تو در مسیر</h3>
                      <div class="path" style="padding-top:22px">
                        <div class="path-line" style="top:40px"></div>
                        <div class="station done" style="flex:0 0 96px"><span class="st-dot">✓</span><b>OSI</b></div>
                        <div class="station done" style="flex:0 0 96px"><span class="st-dot">✓</span><b>IPv4</b></div>
                        <div class="station now" style="flex:0 0 96px"><span class="st-dot">۴</span><b>VLAN</b></div>
                        <div class="station" style="flex:0 0 96px"><span class="st-dot">۵</span><b>OSPF</b></div>
                        <div class="station goal" style="flex:0 0 96px"><span class="st-dot">★</span><b>CCNA</b></div>
                      </div>
                    </div>
                  </div>
                `}
              </div>
            </div>
          </div>`;
      }

      function startTypingTerminal() {
        clearInterval(typeTimer);
        const el = document.getElementById('live-term-code');
        if (!el) return;
        const lines = [
          'R1# conf t',
          'R1(config)# router ospf 1',
          'R1(config-router)# network 10.0.0.0 0.255.255.255 area 0',
          'R1# show ip ospf neighbor -> FULL/DR  (2ms)',
          'R1# _'
        ].join('\n');
        let idx = 0;
        el.textContent = '';
        typeTimer = setInterval(() => {
          idx += 2;
          el.textContent = lines.slice(0, idx);
          if (idx >= lines.length) clearInterval(typeTimer);
        }, 28);
      }

      function renderGallery() {
        clearInterval(typeTimer);
        mainEl.innerHTML = `
          <div class="gal-wrap">
            <div class="gal-head">
              <div>
                <h1>گالری ۲۰ سبک لوکس آکادمی (سبک توپولوژی زنده + داشبورد)</h1>
                <p>همهٔ ۲۰ مدل بر پایهٔ استاندارد طراحی منتخب شما ساخته شده‌اند؛ با رنگ‌بندی، اتمسفر و توپولوژی‌های متنوع (روشن و تیره).</p>
              </div>
            </div>
            <div class="gal-grid">
              ${STYLES.map(s => `
                <article class="gal-card">
                  <div class="gal-thumb" style="background:${s.t.bg};color:${s.t.text};background-image:radial-gradient(circle at 80% 10%,${s.t.glow1},transparent 60%)">
                    <div class="gal-thumb-top">
                      <span style="color:${s.t.accent}">${esc(s.enName)}</span>
                      <span style="padding:2px 8px;border-radius:99px;background:${s.t.panel2};border:1px solid ${s.t.line}">${s.t.isLight?'روشن':'تیره'} · ${esc(s.topoType)}</span>
                    </div>
                    <div class="gal-thumb-title">${esc(s.tagline)}</div>
                    <div class="gal-thumb-mini">
                      <div class="gal-mini-box" style="background:${s.t.panel};border:1px solid ${s.t.line}"><span>R1 → SW1</span><span style="color:${s.t.accent}">● FULL</span></div>
                      <div class="gal-mini-box" style="background:${s.t.grad};color:${s.t.onAccent}"><span>شروع مسیر ←</span></div>
                    </div>
                  </div>
                  <div class="gal-body">
                    <h3>${esc(s.name)}</h3>
                    <p>${esc(s.description)}</p>
                    <div class="gal-swatches">${s.palette.map(c => `<span title="${c}" style="background:${c}"></span>`).join('')}</div>
                  </div>
                  <div class="gal-foot">
                    <button class="st-btn active" data-open="${s.id}" data-v="public">صفحهٔ عمومی</button>
                    <button class="st-btn" data-open="${s.id}" data-v="dashboard">داشبورد</button>
                    <button class="st-btn gold" data-open-full="${s.id}">تمام‌صفحه</button>
                  </div>
                </article>`).join('')}
            </div>
          </div>`;
        mainEl.querySelectorAll('[data-open]').forEach(b => {
          b.onclick = () => { state.styleId = Number(b.dataset.open); state.view = b.dataset.v; state.mode = 'preview'; state.standalone = false; render(); window.scrollTo(0,0); };
        });
        mainEl.querySelectorAll('[data-open-full]').forEach(b => {
          b.onclick = () => { state.styleId = Number(b.dataset.openFull); state.view = 'public'; state.mode = 'preview'; state.standalone = true; render(); window.scrollTo(0,0); };
        });
      }

      function renderPreview() {
        const s = getStyle();
        let inner = '';
        if (state.view === 'public') inner = renderPublicHtml(s);
        else if (state.view === 'dashboard') inner = renderDashboardHtml(s);
        else {
          inner = renderPublicHtml(s) +
            `<div class="container" style="padding:20px 0"><div style="padding:12px 16px;border-radius:12px;border:1px dashed var(--accent);background:var(--panel);color:var(--accent);font-weight:800">▼ نمای داشبورد کاربری دانشجو در همین سبک (${esc(s.name)}) ▼</div></div>` +
            renderDashboardHtml(s);
        }
        mainEl.innerHTML = `
          <div class="stage-root card-${esc(s.cardStyle)}" style="${cssVars(s)}">
            <div class="bg-fx"><span class="glow g1"></span><span class="glow g2"></span><span class="glow g3"></span></div>
            <div class="stage-content">${inner}</div>
          </div>`;

        mainEl.querySelectorAll('[data-go-view]').forEach(b => {
          b.onclick = () => { state.view = b.dataset.goView; render(); window.scrollTo(0,0); };
        });
        mainEl.querySelectorAll('[data-scroll-sec]').forEach(b => {
          b.onclick = () => { document.getElementById(b.dataset.scrollSec)?.scrollIntoView({ behavior: 'smooth' }); };
        });
        mainEl.querySelectorAll('[data-pick-station]').forEach(el => {
          el.onclick = () => { state.selectedStation = Number(el.dataset.pickStation); render(); };
        });
        mainEl.querySelectorAll('[data-dash-tab]').forEach(b => {
          b.onclick = () => { state.dashTab = b.dataset.dashTab; render(); window.scrollTo(0,0); };
        });
        mainEl.querySelectorAll('[data-lab-cmd]').forEach(b => {
          b.onclick = () => { state.labCmd = b.dataset.labCmd; render(); };
        });
        mainEl.querySelectorAll('[data-toggle-mission]').forEach(el => {
          el.onclick = () => { const i = Number(el.dataset.toggleMission); state.missionsDone[i] = !state.missionsDone[i]; render(); };
        });
        startTypingTerminal();
      }

      function render() {
        studioBar.classList.toggle('hidden', state.standalone);
        pillsEl.classList.toggle('hidden', state.standalone || state.mode === 'gallery');
        selectEl.value = String(state.styleId);
        document.getElementById('btn-gallery').classList.toggle('active', state.mode === 'gallery');
        document.getElementById('btn-public').classList.toggle('active', state.mode === 'preview' && state.view === 'public');
        document.getElementById('btn-dash').classList.toggle('active', state.mode === 'preview' && state.view === 'dashboard');
        document.getElementById('btn-split').classList.toggle('active', state.mode === 'preview' && state.view === 'split');

        pillsEl.innerHTML = STYLES.map(s => `
          <button class="st-chip ${s.id===state.styleId?'active':''}" data-chip="${s.id}">
            <span class="st-dot" style="background:${s.t.bg}"></span>
            <span class="st-dot" style="background:${s.t.accent}"></span>
            ${String(s.id).padStart(2,'0')} · ${esc(s.enName)}
          </button>`).join('');
        pillsEl.querySelectorAll('[data-chip]').forEach(b => {
          b.onclick = () => { state.styleId = Number(b.dataset.chip); state.mode = 'preview'; render(); };
        });

        if (state.mode === 'gallery') renderGallery();
        else renderPreview();
      }

      document.getElementById('btn-gallery').onclick = () => { state.mode = 'gallery'; state.standalone = false; render(); };
      document.getElementById('btn-prev').onclick = () => { state.styleId = state.styleId <= 1 ? 20 : state.styleId - 1; state.mode = 'preview'; render(); };
      document.getElementById('btn-next').onclick = () => { state.styleId = state.styleId >= 20 ? 1 : state.styleId + 1; state.mode = 'preview'; render(); };
      selectEl.onchange = () => { state.styleId = Number(selectEl.value); state.mode = 'preview'; render(); };
      document.getElementById('btn-public').onclick = () => { state.mode = 'preview'; state.view = 'public'; render(); };
      document.getElementById('btn-dash').onclick = () => { state.mode = 'preview'; state.view = 'dashboard'; render(); };
      document.getElementById('btn-split').onclick = () => { state.mode = 'preview'; state.view = 'split'; render(); };
      document.getElementById('btn-standalone').onclick = () => { state.mode = 'preview'; state.standalone = true; render(); };

      render();
    })();
  </script>
</body>
</html>
