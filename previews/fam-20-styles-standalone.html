<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FAM Academy — گالری و پیش‌نمایش تعاملی ۲۰ سبک طراحی</title>
  <style>
    :root {
      --studio-bg: #0b0f1a;
      --studio-surface: #111827;
      --studio-border: #1f2937;
      --studio-text: #f8fafc;
      --studio-muted: #94a3b8;
      --studio-accent: #38bdf8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; font-family: 'Vazirmatn', 'IRANSans', 'Segoe UI', Tahoma, sans-serif; background: var(--studio-bg); color: var(--studio-text); }
    button, input, select { font-family: inherit; }
    .studio-bar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(11, 15, 26, 0.94); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--studio-border);
      padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
    }
    .studio-bar.hidden { display: none; }
    .studio-brand { display: flex; align-items: center; gap: 10px; }
    .studio-logo { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg,#06b6d4,#6366f1); display: grid; place-items: center; font-weight: 900; color: #fff; }
    .studio-brand strong { font-size: .95rem; display: block; }
    .studio-brand small { font-size: .75rem; color: var(--studio-muted); }
    .studio-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .studio-btn, .studio-select {
      border: 1px solid #334155; background: #1e293b; color: #f8fafc;
      border-radius: 10px; padding: 7px 12px; font-size: .82rem; font-weight: 700; cursor: pointer;
    }
    .studio-btn:hover { border-color: #38bdf8; }
    .studio-btn.active { background: #0284c7; border-color: #38bdf8; color: #fff; }
    .studio-btn.gold { background: linear-gradient(135deg,#f59e0b,#d97706); border-color: #fbbf24; color: #111; }
    .studio-pills {
      background: #0f172a; border-bottom: 1px solid var(--studio-border);
      padding: 8px 16px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin;
    }
    .studio-pills.hidden { display: none; }
    .style-chip {
      flex: 0 0 auto; border: 1px solid #334155; background: #1e293b; color: #cbd5e1;
      border-radius: 999px; padding: 5px 11px; font-size: .76rem; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    }
    .style-chip.active { border-color: #38bdf8; background: #0c4a6e; color: #fff; font-weight: 800; }
    .chip-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 1px solid rgba(255,255,255,.4); }

    /* Gallery Mode */
    .gallery-wrap { max-width: 1400px; margin: 0 auto; padding: 24px 18px 60px; }
    .gallery-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; align-items: center; justify-content: space-between; }
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 16px; }
    .gal-card {
      background: #111827; border: 1px solid #1f2937; border-radius: 16px; overflow: hidden;
      display: flex; flex-direction: column; justify-content: space-between; transition: transform .18s ease, border-color .18s ease;
    }
    .gal-card:hover { transform: translateY(-3px); border-color: #38bdf8; }
    .gal-preview-mini {
      padding: 16px; min-height: 132px; position: relative; border-bottom: 1px solid rgba(148,163,184,.18);
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .gal-mini-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: .72rem; opacity: .9; }
    .gal-mini-hero { font-weight: 900; font-size: .98rem; line-height: 1.5; margin: 8px 0; }
    .gal-mini-cards { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; }
    .gal-mini-box { height: 26px; border-radius: 6px; }
    .gal-body { padding: 14px 16px; display: grid; gap: 8px; }
    .gal-body h3 { margin: 0; font-size: .96rem; line-height: 1.5; }
    .gal-body p { margin: 0; font-size: .8rem; color: #94a3b8; line-height: 1.7; }
    .gal-pal { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
    .gal-pal span { width: 18px; height: 18px; border-radius: 50%; border: 1px solid rgba(255,255,255,.25); }
    .gal-actions { padding: 0 16px 16px; display: flex; gap: 8px; }
    .gal-actions button, .gal-actions a {
      flex: 1; text-align: center; text-decoration: none; border-radius: 10px; padding: 8px 10px; font-size: .8rem; font-weight: 800; cursor: pointer;
    }

    /* Live Preview Stage */
    #stage-host { min-height: calc(100vh - 104px); }
    .preview-stage {
      min-height: calc(100vh - 104px);
      background-color: var(--bg);
      background-image: var(--glow);
      color: var(--text);
      padding-bottom: 48px;
      transition: background-color .2s ease, color .2s ease;
    }
    .preview-stage.standalone { min-height: 100vh; }
    .stage-container { max-width: 1280px; margin: 0 auto; padding: 18px 20px; }

    /* Shared Preview Primitives (driven by style tokens + archetype classes) */
    .top-nav {
      position: sticky; top: 0; z-index: 40;
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 12px 20px;
    }
    .top-nav-inner {
      max-width: 1280px; margin: 0 auto;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
    }
    .brand-box { display: flex; align-items: center; gap: 10px; }
    .brand-mark {
      width: 38px; height: 38px; border-radius: var(--radius);
      background: var(--accent); color: var(--accent-text);
      display: grid; place-items: center; font-weight: 900; font-size: 1.05rem;
    }
    .brand-box strong { display: block; font-size: .96rem; color: var(--text); }
    .brand-box small { display: block; font-size: .74rem; color: var(--muted); }
    .nav-links { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .pill-tab {
      border: 1px solid var(--border); background: var(--surface2); color: var(--text);
      border-radius: var(--radius); padding: 7px 13px; font-size: .82rem; font-weight: 700; cursor: pointer;
    }
    .pill-tab.active, .btn-primary {
      background: var(--accent); color: var(--accent-text); border: 1px solid var(--accent);
    }
    .btn {
      border: 1px solid var(--borderStrong); background: var(--surface2); color: var(--text);
      border-radius: var(--radius); padding: 9px 16px; font-size: .86rem; font-weight: 800; cursor: pointer;
    }
    .btn-primary {
      border-radius: var(--radius); padding: 10px 18px; font-size: .88rem; font-weight: 800; cursor: pointer;
    }
    .card, .hero-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px;
    }
    .kicker {
      display: inline-block; font-size: .72rem; font-weight: 800; color: var(--accent);
      background: var(--surface2); border: 1px solid var(--borderStrong);
      padding: 4px 10px; border-radius: 999px; margin-bottom: 10px;
    }
    .badge {
      display: inline-flex; align-items: center; gap: 6px; font-size: .74rem; font-weight: 700;
      padding: 4px 10px; border-radius: 999px; background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    }
    .muted { color: var(--muted); }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; direction: ltr; unicode-bidi: isolate; }

    /* Archetype Grid Layouts */
    .hero-grid { display: grid; grid-template-columns: 1.15fr .95fr; gap: 18px; align-items: stretch; margin-top: 16px; }
    .arch-editorial-clean .hero-grid { grid-template-columns: 1fr; text-align: center; }
    .arch-editorial-clean .hero-actions { justify-content: center; }
    .arch-editorial-clean .topo-box { max-width: 900px; margin: 0 auto; width: 100%; }
    .arch-bento-rack .kpi-strip { grid-template-columns: repeat(4, minmax(0,1fr)); }

    .hero-title { margin: 0 0 10px; font-size: clamp(1.45rem, 2.7vw, 2.25rem); line-height: 1.45; font-weight: 900; }
    .hero-lead { margin: 0 0 16px; font-size: .95rem; line-height: 1.85; color: var(--muted); }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .kpi-strip { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; margin-top: 16px; }
    .kpi-box { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
    .kpi-box strong { display: block; font-size: 1.2rem; color: var(--accent); }
    .kpi-box small { font-size: .76rem; color: var(--muted); }

    /* Interactive Topology SVG */
    .topo-box { display: flex; flex-direction: column; justify-content: space-between; gap: 10px; }
    .topo-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .topo-svg-wrap { border: 1px solid var(--border); border-radius: calc(var(--radius) - 4px); background: var(--bg2); padding: 10px; overflow: hidden; }
    .topo-info { background: var(--surface2); border: 1px solid var(--borderStrong); border-radius: 10px; padding: 10px 12px; font-size: .8rem; line-height: 1.7; }

    /* 7-Faculty Interactive Strip */
    .sec-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px; margin: 26px 0 12px; }
    .sec-head h2 { margin: 0; font-size: 1.25rem; }
    .faculty-pills { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 8px; }
    .faculty-pill {
      text-align: right; border: 1px solid var(--border); background: var(--surface); color: var(--text);
      border-radius: var(--radius); padding: 11px 12px; cursor: pointer; display: grid; gap: 4px; transition: .15s ease;
    }
    .faculty-pill.active { border-color: var(--accent); background: var(--surface2); box-shadow: 0 0 0 2px var(--borderStrong); }
    .faculty-pill small { font-size: .7rem; color: var(--accent); font-weight: 800; }
    .faculty-pill strong { font-size: .82rem; line-height: 1.45; }
    .faculty-detail { margin-top: 12px; display: grid; grid-template-columns: 1.2fr .8fr; gap: 14px; }
    .lesson-mini-list { display: grid; gap: 8px; }
    .lesson-mini-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface2);
    }

    /* Dashboard Layout */
    .dash-shell { display: grid; grid-template-columns: 260px minmax(0,1fr); gap: 18px; margin-top: 16px; align-items: start; }
    .dash-side { position: sticky; top: 76px; display: grid; gap: 8px; }
    .dash-nav-btn {
      text-align: right; border: 1px solid var(--border); background: var(--surface2); color: var(--text);
      border-radius: var(--radius); padding: 10px 12px; font-size: .84rem; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between;
    }
    .dash-nav-btn.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
    .dash-main { display: grid; gap: 16px; }
    .dash-grid-2 { display: grid; grid-template-columns: 1.15fr .85fr; gap: 16px; }
    .progress-bar { height: 10px; background: var(--bg2); border: 1px solid var(--border); border-radius: 999px; overflow: hidden; margin: 8px 0; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); width: 42%; border-radius: 999px; }

    /* Interactive Mini-CLI & Subnet Widget */
    .cli-screen {
      background: #050a12; color: #e2e8f0; border: 1px solid #1e293b; border-radius: 10px;
      padding: 12px; font-family: 'JetBrains Mono', Consolas, monospace; font-size: .78rem; line-height: 1.6;
      direction: ltr; text-align: left; min-height: 140px; white-space: pre-wrap; overflow-x: auto;
    }
    .rack-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 11px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface2);
    }
    .led { width: 9px; height: 9px; border-radius: 50%; background: var(--accent2); display: inline-block; box-shadow: 0 0 8px var(--accent2); }
    .led.warn { background: var(--accent); box-shadow: 0 0 8px var(--accent); }

    /* Split Mode */
    .split-divider { margin: 28px 0 10px; padding: 10px 14px; border-radius: 10px; background: var(--surface2); border: 1px dashed var(--accent); font-weight: 800; font-size: .86rem; color: var(--accent); }

    @media (max-width: 1024px) {
      .faculty-pills { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .hero-grid, .faculty-detail, .dash-shell, .dash-grid-2 { grid-template-columns: 1fr; }
      .dash-side { position: static; }
      .arch-bento-rack .kpi-strip { grid-template-columns: repeat(2, minmax(0,1fr)); }
    }
  </style>
</head>
<body>

  <header class="studio-bar" id="studio-bar">
    <div class="studio-brand">
      <div class="studio-logo">20</div>
      <div>

  <main id="studio-main"></main>

          </section>`;
      }

      function renderPreview() {
        const s = activeStyle();
        const w = s.swatches;
        extraCssEl.textContent = s.extraCss || '';
        const styleVars = `
          --bg:${w.bg}; --bg2:${w.bg2}; --surface:${w.surface}; --surface2:${w.surface2};
          --border:${w.border}; --borderStrong:${w.borderStrong};
          --text:${w.text}; --muted:${w.muted};
          --accent:${w.accent}; --accent2:${w.accent2}; --accent-text:${w.accentText};
          --glow:${w.glow}; --radius:${w.radius}; --shadow:${w.shadow};
        `;
        const navHtml = `
          <header class="top-nav">
            <div class="top-nav-inner">
              <div class="brand-box">
                <div class="brand-mark">F</div>
                <div>
                  <strong>FAM Academy · ${esc(s.enName)}</strong>
                  <small>آکادمی جامع مهندسی شبکه و سیسکو (CCNA → CCDE)</small>
                </div>
              </div>
              <div class="nav-links">
                <button class="pill-tab ${state.view==='public'?'active':''}" data-go-view="public">صفحهٔ عمومی</button>
                <button class="pill-tab" data-scroll-fac>۷ دانشکده</button>
                <button class="pill-tab ${state.view==='dashboard'?'active':''}" data-go-view="dashboard">داشبورد دانشجو</button>
                ${state.standalone ? `<button class="btn" id="btn-back-gallery">← بازگشت به گالری ۲۰ مدل</button>` : ''}
              </div>
            </div>
          </header>`;

        let bodyHtml = '';
        if (state.view === 'public') bodyHtml = renderPublicSection(s);
        else if (state.view === 'dashboard') bodyHtml = renderDashboardSection(s);
        else {
          bodyHtml = renderPublicSection(s) +
            `<div class="stage-container"><div class="split-divider">▼ نمای داشبورد کاربری دانشجو در همین سبک (${esc(s.name)}) ▼</div></div>` +
            renderDashboardSection(s);
        }

        mainEl.innerHTML = `<div class="preview-stage arch-${esc(s.archetype)} ${state.standalone ? 'standalone' : ''}" style="${styleVars}">${navHtml}${bodyHtml}</div>`;

        mainEl.querySelectorAll('[data-go-view]').forEach(b => {
          b.onclick = () => { state.view = b.dataset.goView; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
        });
        mainEl.querySelectorAll('[data-scroll-fac]').forEach(b => {
          b.onclick = () => {
            if (state.view === 'dashboard') { state.view = 'public'; render(); }
            setTimeout(() => document.getElementById('faculties-anchor')?.scrollIntoView({ behavior: 'smooth' }), 30);
          };
        });
        mainEl.querySelectorAll('[data-pick-fac]').forEach(b => {
          b.onclick = () => { state.facultyId = b.dataset.pickFac; render(); };
        });
        mainEl.querySelectorAll('.topo-node').forEach(g => {
          g.onclick = () => { state.topoNode = g.dataset.node; render(); };
        });
        mainEl.querySelectorAll('[data-pick-cli]').forEach(b => {
          b.onclick = () => { state.cliCmd = b.dataset.pickCli; render(); };
        });
        mainEl.querySelectorAll('[data-pick-cidr]').forEach(b => {
          b.onclick = () => { state.cidr = Number(b.dataset.pickCidr); render(); };
        });
        document.getElementById('btn-back-gallery')?.addEventListener('click', () => {
          state.standalone = false; state.mode = 'gallery'; render();
        });
      }

      function renderGallery() {
        extraCssEl.textContent = '';
        const cats = [
          ['all', 'همهٔ ۲۰ سبک'],
          ['dark', 'تیره و NOC / سایبری'],
          ['light', 'روشن و مینیمال'],
          ['topology', 'مهندسی و توپولوژی'],
          ['modern', 'مدرن، لاجوردی و گیمیفای']
        ];
        const list = state.filter === 'all' ? STYLES : STYLES.filter(s => s.category === state.filter);
        mainEl.innerHTML = `
          <div class="gallery-wrap">
            <div class="gallery-filters">
              <div>
                <h1 style="margin:0 0 4px;font-size:1.35rem">گالری مقایسهٔ ۲۰ سبک بصری و آموزشی</h1>
                <small style="color:#94a3b8">روی هر مدل کلیک کنید تا صفحهٔ عمومی، داشبورد دانشجو، توپولوژی و ترمینال زندهٔ آن را در مرورگر ببینید.</small>
              </div>
              <div style="display:flex;flex-wrap:wrap;gap:6px">
                ${cats.map(([k, lbl]) => `<button class="studio-btn ${state.filter===k?'active':''}" data-cat="${k}">${lbl}</button>`).join('')}
              </div>
            </div>
            <div class="gallery-grid">
              ${list.map(s => {
                const w = s.swatches;
                return `
                  <article class="gal-card">
                    <div class="gal-preview-mini" style="background:${w.bg};background-image:${w.glow};color:${w.text}">
                      <div class="gal-mini-bar">
                        <span style="color:${w.accent};font-weight:800">${esc(s.enName)}</span>
                        <span style="padding:2px 8px;border-radius:999px;background:${w.surface2};border:1px solid ${w.border}">${esc(s.archetype)}</span>
                      </div>
                      <div class="gal-mini-hero">${esc(s.tagline)}</div>
                      <div class="gal-mini-cards">
                        <div class="gal-mini-box" style="background:${w.surface};border:1px solid ${w.borderStrong}"></div>
                        <div class="gal-mini-box" style="background:${w.accent};opacity:.9"></div>
                        <div class="gal-mini-box" style="background:${w.surface2};border:1px solid ${w.border}"></div>
                      </div>
                    </div>
                    <div class="gal-body">
                      <h3>${esc(s.name)}</h3>
                      <p>${esc(s.description)}</p>
                      <div class="gal-pal">${s.palette.map(c => `<span title="${c}" style="background:${c}"></span>`).join('')}</div>
                    </div>
                    <div class="gal-actions">
                      <button class="studio-btn active" data-open-style="${s.id}" data-open-view="public">صفحهٔ عمومی</button>
                      <button class="studio-btn" data-open-style="${s.id}" data-open-view="dashboard">داشبورد</button>
                      <button class="studio-btn gold" data-open-standalone="${s.id}">تمام‌صفحه</button>
                    </div>
                  </article>`;
              }).join('')}
            </div>
          </div>`;

        mainEl.querySelectorAll('[data-cat]').forEach(b => { b.onclick = () => { state.filter = b.dataset.cat; render(); }; });
        mainEl.querySelectorAll('[data-open-style]').forEach(b => {
          b.onclick = () => {
            state.styleId = Number(b.dataset.openStyle);
            state.view = b.dataset.openView || 'public';
            state.mode = 'preview';
            state.standalone = false;
            render();
            window.scrollTo({ top: 0, behavior: 'auto' });
          };
        });
        mainEl.querySelectorAll('[data-open-standalone]').forEach(b => {
          b.onclick = () => {
            state.styleId = Number(b.dataset.openStandalone);
            state.view = 'public';
            state.mode = 'preview';
            state.standalone = true;
            render();
            window.scrollTo({ top: 0, behavior: 'auto' });
          };
        });
      }

      function render() {
        syncStudioChrome();
        if (state.mode === 'gallery') renderGallery();
        else renderPreview();
      }

      document.getElementById('btn-mode-gallery').onclick = () => { state.mode = 'gallery'; state.standalone = false; render(); };
      document.getElementById('btn-prev').onclick = () => { state.styleId = state.styleId <= 1 ? 20 : state.styleId - 1; state.mode = 'preview'; render(); };
      document.getElementById('btn-next').onclick = () => { state.styleId = state.styleId >= 20 ? 1 : state.styleId + 1; state.mode = 'preview'; render(); };
      selectEl.onchange = () => { state.styleId = Number(selectEl.value); state.mode = 'preview'; render(); };
      document.getElementById('btn-view-public').onclick = () => { state.mode = 'preview'; state.view = 'public'; render(); };
      document.getElementById('btn-view-dash').onclick = () => { state.mode = 'preview'; state.view = 'dashboard'; render(); };
      document.getElementById('btn-view-split').onclick = () => { state.mode = 'preview'; state.view = 'split'; render(); };
      document.getElementById('btn-standalone').onclick = () => { state.mode = 'preview'; state.standalone = true; render(); };

      render();
    })();
  </script>
</body>
</html>
