<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FAM Academy — ۲۰ مدل طراحی کاملاً متفاوت (ساختار، ناوبری، توپولوژی و داشبورد)</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:"Vazirmatn","IRANSans","Segoe UI",Tahoma,sans-serif;background:#05070d;color:#e9f0fb;line-height:1.85;overflow-x:hidden}
    button,input,select{font-family:inherit}

    /* نوار استودیو */
    .studio-bar{position:sticky;top:0;z-index:120;background:rgba(5,7,13,.94);backdrop-filter:blur(14px);border-bottom:1px solid rgba(148,163,184,.2);padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
    .studio-bar.hidden{display:none}
    .studio-brand{display:flex;align-items:center;gap:10px}
    .studio-badge{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#00d4ff,#3b82f6);color:#04121c;font-weight:900}
    .studio-controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
    .st-btn,.st-select{border:1px solid rgba(148,163,184,.25);background:#111a2e;color:#e9f0fb;border-radius:10px;padding:7px 11px;font-size:.8rem;font-weight:700;cursor:pointer}
    .st-btn.active{background:linear-gradient(120deg,#00d4ff,#3b82f6);color:#04121c;border-color:transparent}
    .st-btn.gold{background:linear-gradient(120deg,#fbbf24,#f59e0b);color:#140e02;border-color:transparent}
    .studio-pills{background:#080c16;border-bottom:1px solid rgba(148,163,184,.16);padding:8px 16px;display:flex;gap:6px;overflow-x:auto}
    .studio-pills.hidden{display:none}
    .st-chip{flex:0 0 auto;border:1px solid rgba(148,163,184,.22);background:#0f172a;color:#cbd5e1;border-radius:99px;padding:5px 12px;font-size:.75rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
    .st-chip.active{border-color:#00d4ff;background:#00d4ff1c;color:#fff}
    .st-dot{width:9px;height:9px;border-radius:50%;border:1px solid rgba(255,255,255,.4)}

    /* گالری ۲۰ مدل */
    .gal-wrap{max-width:1360px;margin:0 auto;padding:28px 20px 64px}
    .gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-top:20px}
    .gal-card{background:#0d1424;border:1px solid rgba(148,163,184,.18);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;transition:.18s}
    .gal-card:hover{transform:translateY(-3px);border-color:#00d4ff}
    .gal-head-box{padding:16px;min-height:130px;display:flex;flex-direction:column;justify-content:space-between;border-bottom:1px solid rgba(148,163,184,.14)}
    .gal-body{padding:15px;display:grid;gap:8px}
    .gal-body p{font-size:.82rem;color:#94a3b8;line-height:1.75}
    .gal-swatches{display:flex;gap:6px}.gal-swatches span{width:17px;height:17px;border-radius:50%;border:1px solid rgba(255,255,255,.3)}
    .gal-foot{padding:0 15px 15px;display:flex;gap:8px}.gal-foot button{flex:1}

    /* ساختارهای اختصاصی هر مدل */
    .model-stage{min-height:100vh;background:var(--bg);color:var(--text)}
    .m-container{width:min(1200px,92vw);margin-inline:auto}
    .m-mono{font-family:"JetBrains Mono",Consolas,monospace;direction:ltr;unicode-bidi:isolate}
    .m-card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:0 14px 36px rgba(0,0,0,.14)}
    .m-tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;padding:4px 11px;border-radius:99px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 36%,transparent)}
    .m-btn-pri{border:0;border-radius:12px;padding:10px 18px;background:var(--accent);color:#04121c;font-weight:800;font-size:13.5px;cursor:pointer}
    .m-btn-sec{border:1px solid var(--border);border-radius:12px;padding:10px 18px;background:var(--panel2);color:var(--text);font-weight:700;font-size:13.5px;cursor:pointer}
    .m-h1{font-size:clamp(28px,4.2vw,48px);font-weight:900;line-height:1.4;margin:14px 0}
    .m-lead{font-size:15px;color:var(--muted);line-height:1.9}
    .m-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
    .m-cli{background:#050912;color:#86efac;border:1px solid rgba(148,163,184,.25);border-radius:12px;padding:14px;font-family:"JetBrains Mono",Consolas,monospace;font-size:12px;line-height:1.8;direction:ltr;text-align:left;white-space:pre-wrap}

    .m-nav-glass{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:12px 0}
    .m-nav-in{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
    .m-nav-links{display:flex;gap:6px}.m-nav-links button{border:0;background:transparent;color:var(--muted);padding:7px 12px;border-radius:10px;font-weight:700;cursor:pointer}.m-nav-links button.active{color:var(--text);background:var(--panel2)}

    .m-hero-2col{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center;padding:38px 0}
    .m-grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}

    /* ناوبری کپسولی اپل */
    .m-floating-pill{max-width:660px;margin:0 auto;background:var(--panel);border:1px solid var(--border);border-radius:999px;padding:8px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 14px 40px rgba(15,23,42,.08)}
    .m-floating-pill button{border:0;background:transparent;color:var(--muted);font-weight:700;cursor:pointer;padding:6px 12px;border-radius:99px}
    .m-floating-pill button.active{background:var(--accent);color:#fff}

    /* کابینت رَک ۱۹ اینچ */
    .m-rack-cabinet{background:#090b0f;border:3px solid #2d3544;border-radius:14px;padding:14px;display:grid;gap:8px;box-shadow:inset 0 0 30px rgba(0,0,0,.8)}
    .m-rack-unit{background:linear-gradient(180deg,#1f2530,#161b24);border:1px solid #353f52;border-radius:8px;padding:10px 14px;display:flex;align-items:center;gap:12px;color:#f3f4f6}
    .m-u-num{font-family:monospace;font-weight:900;color:#f59e0b;background:#0b0d12;padding:3px 7px;border-radius:5px;font-size:11.5px}
    .m-leds{display:flex;gap:5px}.m-leds i{width:8px;height:8px;border-radius:50%;background:#374151}.m-leds i.on{background:#10b981;box-shadow:0 0 8px #10b981}.m-leds i.warn{background:#f59e0b;box-shadow:0 0 8px #f59e0b}

    /* داشبوردها */
    .m-dash-grid{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:90vh}
    .m-dash-side{background:var(--panel);border-inline-end:1px solid var(--border);padding:18px 14px;display:flex;flex-direction:column;gap:6px}
    .m-snav{text-align:right;border:1px solid transparent;background:transparent;color:var(--muted);padding:10px 12px;border-radius:11px;font-weight:700;cursor:pointer}
    .m-snav.active{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--text);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}

    .m-pill-header{max-width:1200px;margin:14px auto 0;background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:12px 18px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
    .m-seg-tabs{display:flex;gap:6px;flex-wrap:wrap}.m-seg-tabs button{border:0;background:var(--panel2);color:var(--muted);padding:6px 12px;border-radius:10px;font-weight:700;cursor:pointer}.m-seg-tabs button.active{background:var(--accent);color:#fff}
    .m-bento-dash{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}

    .m-bottom-dock{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:80;background:rgba(15,23,42,.86);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:8px 14px;display:flex;gap:8px;box-shadow:0 20px 50px rgba(0,0,0,.45)}
    .m-bottom-dock button{border:0;background:transparent;color:#e2e8f0;padding:7px 14px;border-radius:999px;font-weight:700;cursor:pointer}.m-bottom-dock button.active{background:var(--accent);color:#04121c}

    .dot-r,.dot-y,.dot-g{width:11px;height:11px;border-radius:50%;display:inline-block}.dot-r{background:#fb7185}.dot-y{background:#fbbf24}.dot-g{background:#34d399}

    /* شش‌ضلعی آرنای سایبری */
    .m-hex{width:170px;height:150px;clip-path:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%);background:var(--panel2);border:2px solid var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px;transition:.2s}
    .m-hex:hover{transform:scale(1.06);background:var(--accent);color:#04121c}

    /* استایل خاص نئوبروتالیست (مدل ۹) */
    [data-model="9"] .m-card,[data-model="9"] .m-btn-pri,[data-model="9"] .m-btn-sec{border:2.5px solid #111827!important;box-shadow:5px 5px 0 #111827!important;border-radius:10px!important}
    [data-model="2"] .m-btn-pri,[data-model="5"] .m-btn-pri,[data-model="6"] .m-btn-pri,[data-model="10"] .m-btn-pri,[data-model="12"] .m-btn-pri,[data-model="16"] .m-btn-pri{color:#ffffff}

    @media (max-width:920px){
      .m-hero-2col,.m-dash-grid,.m-bento-dash{grid-template-columns:1fr!important}
      .m-card[style*="span 2"]{grid-column:auto!important}
    }
  </style>
</head>

    <div class="studio-brand">
      <div class="studio-badge">20</div>
      <div>
        <strong>FAM Academy — ۲۰ مدل کاملاً متمایز (ساختار، چیدمان و تجربه کاربری متفاوت)</strong>
        <small>هر مدل علاوه بر رنگ، ساختار صفحهٔ عمومی، توپولوژی/نمودار و داشبورد منحصربه‌فرد خودش را دارد</small>
      </div>
    </div>
    <div class="studio-controls">
      <button class="st-btn active" id="btn-gallery">گالری ۲۰ مدل</button>
      <button class="st-btn" id="btn-prev">← قبلی</button>

      <button class="st-btn" id="btn-next">بعدی →</button>

      <button class="st-btn gold" id="btn-standalone">تمام‌صفحهٔ خالص</button>
    </div>
  </header>

  <main id="studio-main"></main>

        view: params.get('view') || 'public',
        standalone: params.get('standalone') === '1',
        styleId: Math.min(20, Math.max(1, Number(params.get('style')) || 1))
      };

      const selectEl = document.getElementById('select-style');
      const pillsEl = document.getElementById('studio-pills');
      const mainEl = document.getElementById('studio-main');
      const studioBar = document.getElementById('studio-bar');

      selectEl.innerHTML = MODELS.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join('');
      const activeModel = () => MODELS.find(m => m.id === state.styleId) || MODELS[0];

      function varsCss(m) {
        return Object.entries(m.vars).map(([k, v]) => `--${k}:${v}`).join(';');
      }

      function renderGallery() {
        mainEl.innerHTML = `
          <div class="gal-wrap">
            <h1>۲۰ مدل طراحی کاملاً متفاوت (از نظر ساختار صفحه، چیدمان، گرافیک و داشبورد)</h1>
            <p style="color:#94a3b8;margin-top:6px">هر مدل معماری اختصاصی خود را دارد: کابینت رَک ۱۹ اینچ، نقشه مترو، بنتو گرید، CAD اتوکد، تایم‌لاین عمودی، پالت ⌘K، برد کانبان، دسکتاپ شیشه‌ای، رادار SOC و غیره.</p>
            <div class="gal-grid">
              ${MODELS.map(m => `
                <article class="gal-card">
                  <div class="gal-head-box" style="background:${m.vars.bg};color:${m.vars.text}">
                    <div style="display:flex;justify-content:space-between;font-size:11.5px;font-weight:800">
                      <span style="color:${m.vars.accent}">${esc(m.badge)}</span>
                      <span style="opacity:.8">${esc(m.enName)}</span>
                    </div>
                    <strong style="font-size:1.02rem;line-height:1.5">${esc(m.name)}</strong>
                  </div>
                  <div class="gal-body">
                    <p>${esc(m.layoutDesc)}</p>
                    <div class="gal-swatches">${m.palette.map(c => `<span style="background:${c}"></span>`).join('')}</div>
                  </div>
                  <div class="gal-foot">
                    <button class="st-btn active" data-open="${m.id}" data-v="public">صفحهٔ عمومی</button>
                    <button class="st-btn" data-open="${m.id}" data-v="dashboard">داشبورد</button>
                    <button class="st-btn gold" data-open-full="${m.id}">تمام‌صفحه</button>
                  </div>
                </article>`).join('')}
            </div>
          </div>`;
        mainEl.querySelectorAll('[data-open]').forEach(b => {
          b.onclick = () => { state.styleId = Number(b.dataset.open); state.view = b.dataset.v; state.mode = 'preview'; state.standalone = false; render(); window.scrollTo(0,0); };
        });
        mainEl.querySelectorAll('[data-open-full]').forEach(b => {
          b.onclick = () => { state.styleId = Number(b.dataset.openFull); state.view = 'public'; state.mode = 'preview'; state.standalone = true; render(); window.scrollTo(0,0); };
        });
      }

      function renderPreview() {
        const m = activeModel();
        let html = '';
        if (state.view === 'public') html = window.FAM_RENDERERS.buildPublic(m);
        else if (state.view === 'dashboard') html = window.FAM_RENDERERS.buildDashboard(m, state);
        else {
          html = window.FAM_RENDERERS.buildPublic(m) +
            `<div class="m-container" style="padding:18px 0"><div style="padding:12px 16px;border:2px dashed var(--accent);border-radius:12px;color:var(--accent);font-weight:800">▼ نمای داشبورد دانشجو در مدل ${m.id} (${esc(m.enName)}) ▼</div></div>` +
            window.FAM_RENDERERS.buildDashboard(m, state);
        }
        mainEl.innerHTML = `<div class="model-stage" data-model="${m.id}" style="${varsCss(m)}">${html}</div>`;
        mainEl.querySelectorAll('[data-go]').forEach(el => {
          el.onclick = () => { state.view = el.dataset.go; render(); window.scrollTo(0,0); };
        });
        const cmdIn = document.getElementById('cmdk-input');
        if (cmdIn) {
          cmdIn.addEventListener('input', () => {
            const q = cmdIn.value.trim().toLowerCase();
            document.querySelectorAll('.cmdk-row').forEach(r => {
              r.style.display = r.textContent.toLowerCase().includes(q) ? 'flex' : 'none';
            });
          });
        }
      }

      function render() {
        studioBar.classList.toggle('hidden', state.standalone);
        pillsEl.classList.toggle('hidden', state.standalone || state.mode === 'gallery');
        selectEl.value = String(state.styleId);
        document.getElementById('btn-gallery').classList.toggle('active', state.mode === 'gallery');
        document.getElementById('btn-public').classList.toggle('active', state.mode === 'preview' && state.view === 'public');
        document.getElementById('btn-dash').classList.toggle('active', state.mode === 'preview' && state.view === 'dashboard');
        document.getElementById('btn-split').classList.toggle('active', state.mode === 'preview' && state.view === 'split');

        pillsEl.innerHTML = MODELS.map(m => `
          <button class="st-chip ${m.id===state.styleId?'active':''}" data-chip="${m.id}">
            <span class="st-dot" style="background:${m.vars.bg}"></span>
            <span class="st-dot" style="background:${m.vars.accent}"></span>
            ${String(m.id).padStart(2,'0')} · ${esc(m.enName)}
          </button>`).join('');
        pillsEl.querySelectorAll('[data-chip]').forEach(b => {
          b.onclick = () => { state.styleId = Number(b.dataset.chip); state.mode = 'preview'; render(); };
        });

        if (state.mode === 'gallery') renderGallery();
        else renderPreview();
      }

      document.getElementById('btn-gallery').onclick = () => { state.mode = 'gallery'; state.standalone = false; render(); };
      document.getElementById('btn-prev').onclick = () => { state.styleId = state.styleId <= 1 ? 20 : state.styleId - 1; state.mode = 'preview'; render(); };
      document.getElementById('btn-next').onclick = () => { state.styleId = state.styleId >= 20 ? 1 : state.styleId + 1; state.mode = 'preview'; render(); };
      selectEl.onchange = () => { state.styleId = Number(selectEl.value); state.mode = 'preview'; render(); };
      document.getElementById('btn-public').onclick = () => { state.mode = 'preview'; state.view = 'public'; render(); };
      document.getElementById('btn-dash').onclick = () => { state.mode = 'preview'; state.view = 'dashboard'; render(); };
      document.getElementById('btn-split').onclick = () => { state.mode = 'preview'; state.view = 'split'; render(); };
      document.getElementById('btn-standalone').onclick = () => { state.mode = 'preview'; state.standalone = true; render(); };

      render();
    })();
  </script>
</body>
</html>
